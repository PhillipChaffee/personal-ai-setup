# Version pins that MORE THAN ONE installer needs, in one file so the two can
# never quietly disagree.
#
# Before this file the goose version was pinned twice, by two different
# mechanisms, to two potentially different versions:
#
#   the brain   cloud-init.yaml.tftpl ran the installer with GOOSE_VERSION=v1.46.0
#               -- an exact version, every time.
#   the Mac     bootstrap-mac.sh ran `brew pin block-goose-cli` -- which freezes
#               WHATEVER BREW HAPPENED TO INSTALL at bootstrap time, and on a Mac
#               set up today that is whatever brew's latest is.
#
# So "both are pinned" was true and "both are pinned to the same thing" was not.
#
# The two sides consume this differently, and deliberately:
#
#   the brain   INSTALLS exactly `goose.version` -- Terraform reads this file and
#               interpolates it into cloud-init, so a new brain gets this version
#               and no other.
#   the Mac     keeps Homebrew (an unmanaged binary on a laptop is worse than a
#               version skew) and ASSERTS instead: bootstrap-mac.sh compares the
#               installed `goose --version` against this and says so when they
#               differ. One source of truth, both sides read it, and only the
#               side that can honour it exactly is asked to.
#
# Bumping: change it here, re-run scripts/mac/bootstrap-mac.sh (it will tell you
# to `brew upgrade block-goose-cli`), and re-provision or upgrade the brain in
# the same sitting. Note that editing this file changes the rendered cloud-init
# and therefore `user_data`, which main.tf's lifecycle block deliberately
# ignores -- an existing brain is NOT rebuilt by a pin bump, and re-running
# cloud-init needs the documented `terraform apply -replace=hcloud_server.brain`.
goose:
  # The version this whole setup is verified against. goose releases roughly
  # weekly and 2.0 is in RC churn, so upgrades are opt-in rather than automatic.
  version: "1.46.0"
  verified_on: "2026-08-20"
  # sha256 of config/goose/acp-contract.json, which is the ACP surface goose
  # published AT `version` above -- method names and the extension field names
  # -- captured from crates/goose/{acp-meta,acp-schema}.json and committed, so
  # that check-connectors.sh can assert the contract with no network.
  #
  # It lives HERE rather than beside the capture for one reason: it makes the
  # pin and the capture move together. Bumping `version` without re-running
  # `scripts/verify/check-connectors.sh --refresh-contract` leaves a capture
  # taken at the OLD tag, and check-connectors.sh --offline goes red saying so;
  # re-taking it at the new tag names any method that disappeared. The hash
  # itself catches the other half: a capture edited by hand to make the check
  # pass. Evidence, not configuration.
  acp_contract_sha256: "5fae385e8173a0599b2e9784e2327c6ce749430a188dd0cf8aba8177ffa67a5a"
