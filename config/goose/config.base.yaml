# Goose configuration template — personal-ai-setup
# copy to ~/.config/goose/config.yaml (Mac) / copied no-clobber by deploy-vps.sh (brain)
#
# Schema (goose 1.4x): top-level `active_provider` + `providers:` map +
# `extensions:` map. Reference:
# https://github.com/aaif-goose/goose/blob/main/documentation/docs/guides/config-files.md
# Env vars GOOSE_PROVIDER / GOOSE_MODEL override this file per-process.
#
# API keys are NOT read from this file. Each custom provider names its key env
# var in config/goose/custom_providers/*.json (`api_key_env`):
#   OPENCODE_ZEN_API_KEY  -> zen-openai, zen-anthropic, zen-free
#   TOGETHER_API_KEY      -> together
#   OPENAI_API_KEY        -> openai (built-in provider, optional — see below)
# Mac: keys live in the Keychain (scripts/mac/keychain-secrets.sh exports them).
# Brain: keys come from /data/secrets.env via the systemd unit's EnvironmentFile.
#
# Model lists: the provider JSONs ship with broad catalogs (verified as of
# 2026-08-20); scripts/sync-models.sh refreshes them from the live Zen and
# Together /models endpoints whenever you want the full, current roster.
#
# NOTE (unverified upstream): the documented `providers:` map examples use
# built-in provider names; custom providers are documented via
# `goose session --provider <name>` and `goose configure`. If your goose
# version ignores a custom name in this map, run `goose configure` once,
# pick zen-anthropic, and let it rewrite this block in the shape it expects.
# scripts/verify/check-goose.sh exercises all three providers.

active_provider: together

providers:
  # DEFAULT / hub daily driver. Together's ZDR posture also makes this the
  # sensitive tier, so the default is the most private option.
  # GLM-5.3-Flash (#194, owner decision 2026-09-26): 320B MoE / 18B active,
  # 1M context, verified function calling, $0.15/$0.50 per 1M tokens — the
  # same model the Mac's OpenCode already runs. Qwen3.5-397B ($0.60/$3.60)
  # is the heavier alternative; drop to openai/gpt-oss-120b when you want
  # cheapest.
  together:
    enabled: true
    configured: true
    model: zai-org/GLM-5.3-Flash

  # Premium alternative when you want Claude — this provider routes through
  # Zen's Anthropic /messages engine, which does NOT serve glm-5.3-flash
  # (that model lives on the /chat/completions engine only), so its default
  # stays Claude: Anthropic-billed via Zen => 30-day retention, meaning
  # NON-SENSITIVE work only (docs/model-routing.md, rule 2). The GLM
  # fallback for this tier is zen-openai's glm-5.3-flash.
  zen-anthropic:
    enabled: true
    configured: true
    model: claude-sonnet-5

  # Cost-saver tier (Zen zero-retention open models). Default is the same
  # GLM-5.3-Flash (#200) — Zen prices it identically to Together; the cheap
  # alternates (minimax-m3 $0.30/$1.20, deepseek-v4.1-flash $0.30/$1.20) are
  # picker picks.
  zen-openai:
    enabled: true
    configured: true
    model: glm-5.3-flash

  # Zen's FREE models — $0, but they TRAIN ON YOUR DATA (docs/privacy.md).
  # Tier-1 throwaway, non-personal work only; the provider name keeps the
  # boundary visible in the model picker.
  zen-free:
    enabled: true
    configured: true
    model: big-pickle

  # OPTIONAL: OpenAI's own API via goose's built-in provider. Uncomment and
  # add OPENAI_API_KEY (Keychain / secrets.env) if you create an OpenAI
  # account. Note: Zen's GPT-5.x models are NOT reachable from goose (they
  # live behind Zen's Responses endpoint) — this direct route is how you get
  # GPT models in goose; OpenCode reaches Zen's GPT models natively either
  # way, and OpenAI's open-weight gpt-oss models are already on `together`.
  # OpenAI API retention is ~30 days => non-sensitive work only, same as
  # hard rule 2.
  # openai:
  #   enabled: true
  #   configured: true
  #   model: gpt-5.2

extensions:
  # Shell, file edits, etc. Built-in, on by default upstream; kept explicit.
  developer:
    name: developer
    type: builtin
    enabled: true
    timeout: 300

  # Built-in memory extension (off by default upstream — we enable it).
  # Stores facts under ~/.config/goose/memory/; all saved memories are loaded
  # into every prompt, so prune categories now and then to keep token cost down.
  memory:
    name: memory
    type: builtin
    enabled: true
    timeout: 300

  # goose's `apps` platform extension — ENABLED BY DEFAULT upstream in 1.46.0,
  # turned off here deliberately. Tool calls an app initiates are dispatched
  # WITHOUT passing through the permission manager, so an imported app is an
  # unreviewed route to every other extension's tools: shell commands and
  # every MCP tool there is. The brain gives up nothing — its client is Goose
  # Desktop, which does not need the apps surface
  # (`_goose/unstable/apps/{list,export,import,delete}` over ACP).
  # docs/security.md. Verify it took on an older brain: `goose configure` ->
  # Toggle Extensions, or the ACP call _goose/unstable/config/extensions/list.
  apps:
    name: apps
    type: platform
    enabled: false
