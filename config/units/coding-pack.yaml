---
# coding-pack — the Cursor port: eleven skills, copied no-clobber into $HOME.
#
# DESCRIBES TODAY. unit_coding_pack() installs it. The OpenCode half of the
# port (30 subagents + the global AGENTS.md) left the SHIPPED install with the
# herdr pivot (#144, 2026-09-25): no coding agent installs on the Mac, so
# writing ~/.config/opencode/ served nothing in the shipped story and the repo
# sets nothing for people (#135). The files stay in the repo as paste-in
# material — see the repo_file owns below. An enumerated skill list, one glob
# loop, no verify script, and a runbook that documents the PORT DECISIONS
# rather than the install.
id: coding-pack
manifest_version: 1
verified_on: "2026-09-25"
summary: Eleven ported Cursor skills; the ported OpenCode agents and AGENTS.md stay in the repo as paste-in material.
host: mac
tier: default_on
requires: []

# Markdown. It bills through whatever model reads it -- no model row of its
# own, so there is no README budget row either.
cost: []

installer:
  script: scripts/mac/bootstrap-mac.sh
  function: unit_coding_pack
  status: present

# NO check-*.sh COVERS THIS UNIT. docs/cursor-port.md:124 has a "Verifying the
# port on your Mac" section, and it is a list of things for a HUMAN to type.
# The eleven skill directories are covered outside that set (see the blocker
# below); the 30 agents and AGENTS.md are covered NOWHERE, and they are what
# the skills dispatch into BY NAME -- cursor-port.md:99-100 records that the
# filenames were kept unchanged for exactly that reason.
verify: []
runbook: docs/cursor-port.md

secrets: []

owns:
  # The eleven Cursor-ported skills, enumerated rather than claimed as
  # config/skills/ wholesale. These eleven names are also unit_coding_pack()'s install
  # list (SKILLS_CODING_PACK in bootstrap-mac.sh), by name and not as a
  # complement -- a twelfth skill neither unit claims installs nowhere rather
  # than silently landing here.
  - {kind: repo_file, target: config/skills/ci-lint-test}
  - {kind: repo_file, target: config/skills/clean-plan}
  - {kind: repo_file, target: config/skills/code-review}
  - {kind: repo_file, target: config/skills/deep-research}
  - {kind: repo_file, target: config/skills/looping-code-review}
  - {kind: repo_file, target: config/skills/looping-plan-review}
  - {kind: repo_file, target: config/skills/mr-review}
  - {kind: repo_file, target: config/skills/plan-review}
  - {kind: repo_file, target: config/skills/pre-mr-checklist}
  - {kind: repo_file, target: config/skills/refactor-planner}
  - {kind: repo_file, target: config/skills/ship}
  # Their destinations. Enumerated for the same reason the sources are: the
  # parent ~/.agents/skills holds two units' work and is created idempotently
  # by BOTH of them, so no single unit can claim the directory.
  - {kind: home_path, target: ~/.agents/skills/ci-lint-test}
  - {kind: home_path, target: ~/.agents/skills/clean-plan}
  - {kind: home_path, target: ~/.agents/skills/code-review}
  - {kind: home_path, target: ~/.agents/skills/deep-research}
  - {kind: home_path, target: ~/.agents/skills/looping-code-review}
  - {kind: home_path, target: ~/.agents/skills/looping-plan-review}
  - {kind: home_path, target: ~/.agents/skills/mr-review}
  - {kind: home_path, target: ~/.agents/skills/plan-review}
  - {kind: home_path, target: ~/.agents/skills/pre-mr-checklist}
  - {kind: home_path, target: ~/.agents/skills/refactor-planner}
  - {kind: home_path, target: ~/.agents/skills/ship}
  # The ported OpenCode agents (claimed as the directory) and the global
  # AGENTS.md are owned but NEVER INSTALLED, on purpose: unit_coding_pack()
  # stopped writing ~/.config/opencode/ with the herdr pivot (#144,
  # 2026-09-25) — no coding agent installs on the Mac, so the copies served
  # nothing in the shipped story, and the repo sets nothing for people (#135).
  # They are paste-in material for a self-installed OpenCode, exactly like
  # project-rules/ below. Their home_path targets are gone with the installer
  # loops; a Mac that still carries them from an earlier install removes them
  # by hand.
  - {kind: repo_file, target: config/opencode/agents}
  - {kind: repo_file, target: config/opencode/AGENTS.md}
  # Owned but NEVER INSTALLED, on purpose: unit_coding_pack() prints that the
  # per-project rule snippets stay in the repo and are pasted into a project by
  # hand. It is this unit's file with no destination.
  - {kind: repo_file, target: config/opencode/project-rules}

manual_steps:
  - id: paste-project-rules
    summary: Copy the snippets you want out of config/opencode/project-rules/
      into a project's own rules file. Nothing installs them; the bootstrap
      only prints where they live.
    doc: docs/cursor-port.md#where-everything-landed
    blocking: false
  - id: paste-the-opencode-port
    summary: For a self-installed OpenCode on the Mac, copy the 30 subagents
      from config/opencode/agents/ and the global rules from
      config/opencode/AGENTS.md into ~/.config/opencode/ by hand — the
      bootstrap stopped shipping them with the herdr pivot (#144, 2026-09-25).
    doc: docs/cursor-port.md
    blocking: false

blockers:
  - id: no-verify
    severity: warn
    detail: "No check-*.sh asserts that 11 skills and 30 agents landed.
      doctor.py:166-182 (`pai doctor`, which `pai verify` never runs) covers
      the skills half by comparing config/skills/ against ~/.agents/skills;
      its roster stops there -- extensions, skills, providers, goosehints --
      so a half-copied ~/.config/opencode/agents is invisible everywhere. The
      copy loops keep whatever is already present (copy_no_clobber() prints
      `kept existing` and moves on), so stale is silent too."
  - id: doctor-is-not-selection-aware
    severity: warn
    detail: "bootstrap-mac.sh can now leave this unit out (--only base-goose
      never reaches it), but doctor.py:166-182 compares ~/.agents/skills
      against every directory in
      config/skills/ and hard-FAILs on the difference. So a deliberate
      selective install reads as a broken one: `pai doctor` says '11 of 12
      shipped skills are not installed' and tells you to re-run the bootstrap,
      which is exactly what you did. Making doctor selection-aware needs the
      enabled-unit registry (#40) -- it cannot be inferred from $HOME, because
      an absent skill and a skipped unit look identical there."
  - id: runbook-documents-the-port-not-the-install
    severity: note
    detail: docs/cursor-port.md is a decision log -- what was ported, adapted
      and dropped. It is the closest thing to a runbook and it is what this
      unit points at, but nothing in it tells a reader how to install or
      re-install the pack.

uninstall:
  supported: false
  reason: "Nothing removes ~/.agents/skills, and the no-clobber install means
    this repo cannot tell which entries it wrote from ones you added. Removing
    the wrong file loses your own work."

notes: >-
  The OpenCode half of the port left the shipped install with the herdr pivot
  (#144, 2026-09-25); the repo files remain as paste-in material. Those files
  are 11 cr-*, 12 pr-*, 2 refactor scouts and 5 research agents
  (docs/cursor-port.md:97-98, which also records that the issue's "31" was a
  miscount). Filenames equal agent names and the skills dispatch by name, so
  renaming a file here breaks a cross-reference that nothing checks -- which
  is the strongest argument on this manifest for the verify script it does
  not have.
