---
# code-agents — the per-chat OpenCode container plane on the brain: rootless
# podman, the code-agent:local image, /data/code-agents and the session
# manager on port 4300.
#
# DESCRIBES TODAY. deploy-vps.sh:661-720 is the second-largest region in
# either installer - only brain's path-root migration at deploy-vps.sh:390-516
# is bigger - and, unusually for this catalog, this unit has a real verify
# script that probes a live plane. It is now unit_code_agents(), gated by
# `deploy-vps.sh --with/--without/--only code-agents`, which is the one
# selection in this catalog that saves real time and real disk: an apt install
# on the first deploy (guarded by `command -v podman`) and a multi-minute image
# build on EVERY deploy, both of which every brain used to pay for.
id: code-agents
manifest_version: 1
verified_on: "2026-09-07"
summary: Rootless podman, the code-agent image, and the per-chat session manager.
host: vps
tier: opt_in
requires: [brain]

# Copied VERBATIM from README.md's budget table (:153). The row says this unit
# opens no new account and bills through base-goose's two inference rows -
# which is exactly why no figure is invented here, even though README.md:155
# names this the one line item that can move the total on its own.
cost:
  - line: Code agents on the brain (containers)
    amount: no new account — bills to the Zen/Together lines above, plus disk
    source: README.md

installer:
  script: scripts/vps/deploy-vps.sh
  function: unit_code_agents
  status: present

# The strongest verify script in the catalog: --probe creates a scratch chat,
# asserts the container cannot reach /data, asserts the environment carries no
# stack secrets, exercises stop then wake with state intact, and deletes it.
verify:
  - scripts/verify/check-code-agents.sh
runbook: docs/setup/70-code-agents.md

secrets:
  - key: OPENCODE_SERVER_PASSWORD
    # HTTP Basic for the manager gateway AND every per-chat server behind it.
    # deploy-vps.sh:690-691 enables the unit only when this and the PAT are
    # both non-empty.
    store: vps
    secret: true
    optional: false
  - key: GITHUB_CODE_AGENT_PAT
    # Fine-grained, scoped to the repos in /data/code-agents/repos.json only.
    # It lives INSIDE the chat container as GH_TOKEN, which is why the probe
    # checks the container's environment for anything else.
    store: vps
    secret: true
    optional: false
  - key: NTFY_AGENT_TOPIC
    # The agent channel, published by code-agent-manager.py directly rather
    # than through notify.sh. A SECOND topic on purpose: this is the one a
    # phone subscribes to, so it must be burnable without taking the failure
    # channel (ntfy-alerts' NTFY_TOPIC) with it. Empty means the feature is
    # simply off.
    store: vps
    secret: true
    optional: true

owns:
  - {kind: repo_file, target: config/code-agents/Containerfile}
  - {kind: repo_file, target: config/code-agents/opencode.json}
  # The container's standing instructions, rendered into every chat volume
  # beside the opencode config. A CONVENTION and nothing more - see the
  # agent-authored-pr-body blocker below.
  - {kind: repo_file, target: config/code-agents/AGENTS.md}
  - {kind: repo_file, target: config/code-agents/repos.example.json}
  - {kind: repo_file, target: scripts/vps/code-agent-manager.py}
  - {kind: repo_file, target: scripts/vps/systemd/code-agent-manager.service}
  - {kind: container_image, target: "code-agent:local"}
  - {kind: systemd_unit, target: code-agent-manager.service}
  # deploy-vps.sh:686-687. The directory holds one volume per chat; repos.json
  # is seeded from the example by install_template, which never clobbers an
  # existing file.
  - {kind: data_path, target: /data/code-agents}
  - {kind: data_path, target: /data/code-agents/repos.json}
  # Host-level side effects with no file to name, all from deploy-vps.sh:
  # deploy-vps.sh:672-675 installs the packages, deploy-vps.sh:679-680 grants
  # agent a subordinate id range, and deploy-vps.sh:681 keeps /run/user/1000
  # alive so a system unit can drive rootless podman as agent.
  - {kind: manual, target: "apt packages: podman, uidmap, slirp4netns"}
  - {kind: manual, target: "subuid/subgid range 100000-165535 for user agent"}
  - {kind: manual, target: "loginctl linger for user agent"}

manual_steps:
  - id: create-the-two-secrets
    summary: Generate OPENCODE_SERVER_PASSWORD and issue a fine-grained GitHub
      PAT (Contents + Pull requests, selected repos only), then add both to
      /data/secrets.env. Until both are set the manager is installed but never
      enabled.
    doc: docs/setup/70-code-agents.md#1-create-the-two-secrets
    blocking: true
  - id: fill-the-repo-allowlist
    summary: Edit /data/code-agents/repos.json - the deploy seeds it from the
      example and will not overwrite your copy, so an unedited allowlist means
      the agents can clone nothing.
    doc: docs/setup/70-code-agents.md#3-fill-in-the-repo-allowlist
    blocking: true
  - id: point-clients-at-the-plane
    summary: Add the tailnet URL on port 4300 with username opencode and the
      server password to the phone app, the OpenCode desktop app, or a browser
      on the tailnet.
    doc: docs/setup/70-code-agents.md#5-point-your-clients-at-it
    blocking: false

blockers:
  - id: deploy-stops-every-running-chat
    severity: warn
    detail: deploy-vps.sh:710 restarts the manager rather than starting it, and
      the unit's ExecStopPost stops everything labelled code-agent=1, which
      runs during the stop half of a restart. Volumes, agent branches and
      transcripts survive; an in-flight turn and OpenCode's in-memory
      permission asks do not. Deploy when nothing is mid-turn.
  - id: absent-is-indistinguishable-from-failed
    severity: note
    detail: "check-code-agents.sh now exits 2 (SKIP, not FAIL) when neither
      code-agent-manager.service nor /data/code-agents exists, so a brain
      deployed with --without code-agents does not carry a permanently-red
      check. It CANNOT tell that state apart from a code-agents install that
      failed: there is no signal on the host that distinguishes them. If you
      did select the unit, re-run `deploy-vps.sh --only code-agents` and read
      its output. That ambiguity is the price of the gate, and it is written
      down here rather than left in nobody's head. The precondition is keyed on
      the deploy artifacts ALONE and deliberately not on `podman` being absent:
      GitHub's ubuntu runners ship podman system-wide, so an AND that included
      it would never fire and the arm would be inert."
  - id: chats-share-the-brains-data-volume
    severity: warn
    detail: Each chat gets its own volume under /data/code-agents, on the same
      10 GB LUKS volume as everything else by default.
      check-code-agents.sh derives its ceiling from the volume at check time
      (:164-166) using the 75% default at :51, so it FAILs at three quarters
      full - a gate, not a fix. The remedy is growing data_volume_size or
      deleting old chats.
  - id: missing-from-the-setup-phase-table
    severity: note
    detail: docs/setup/00-overview.md's phases table has no row for code
      agents, and `grep -c 70-code-agents docs/setup/00-overview.md` returns 0.
      The runbook this manifest names is reachable only from
      docs/code-agents.md and docs/troubleshooting.md, so a reader following
      the setup docs in order never arrives at it.
  - id: enable-is-still-conditional-on-the-two-secrets
    severity: note
    detail: The gate and the enable answer different questions and both still
      apply. `--without code-agents` means "do not provision this at all";
      the two-secret test at deploy-vps.sh:690-691 means "the credentials are
      not there yet". Selecting the unit with an empty OPENCODE_SERVER_PASSWORD
      or GITHUB_CODE_AGENT_PAT still installs everything and leaves the manager
      disabled, exactly as before.
  - id: agent-authored-pr-body-is-a-convention
    severity: note
    detail: "config/code-agents/AGENTS.md tells the agent to put an
      `Agent-authored:` line first in every pull-request body, and nothing
      enforces it: the agent writes the body, and the manager performs no git
      operation after create-time. There is an OBSERVABLE rather than a
      control - pull_to_wire reports `agent_authored` on /api/pulls and
      /api/chats/<id>/pulls, absent when GitHub sent no body - so a convention
      that stopped being followed is visible instead of assumed. There IS one
      assertion about the file (test-code-agent-manager.sh:440), and it is a
      drift-lock between two strings in this repo, not evidence about any pull
      request: AGENTS.md's marker label and the AGENT_PR_MARKER constant
      pull_to_wire greps for have to agree, or every pull silently reads
      agent_authored false."
  - id: sandbox-probes-need-a-real-brain
    severity: note
    detail: "check-code-agents.sh --probe covers the three properties B1 and B5
      name - /share refused, external_directory denied, and another chat out of
      reach. That last one runs THREE vectors, each with its own verdict: the
      filesystem (B's host path, traversal out of A's mount, and a bounded
      find(1) over A's whole filesystem, which subsumes the other two - one
      vector tried three ways, not three vectors), chat B's published port on
      the host, and the manager's own /chat/<id>/<path> proxy. All of it reads
      the RUNNING container rather than the template in this repo, so all of it
      needs podman and a live gateway; CI drives the same functions in
      scripts/verify/code-agent-probes.sh against fixtures
      (test-verify-checks.sh section 5), which proves the probes FIRE and
      proves nothing about isolation. Two arms can only report a SKIP off a
      brain, and will report one ON a brain that cannot make the connection:
      the published-port arm needs A to reach its OWN published port over a
      host address first, and the proxy arm needs the gateway to answer inside
      A's netns at all. The external_directory arm is weaker than the rest by
      construction: it reads the policy the server resolved, not a denied tool
      call, so it says the policy is loaded and not that it is enforced."
  - id: the-gateway-proxy-has-no-per-chat-authorization
    severity: note
    detail: "Issue #115. code-agent-manager.py's /chat/<id>/<path> takes any
      chat id and authorizes none of them; the only gate is one global
      PASSWORD, and run_container hands that same value to every chat
      container. A code agent that can route to the gateway can therefore read
      or drive any other chat, and wake a stopped one to do it - no mount bug
      and no port guess needed. The probe's proxy arm reports whether the
      gateway is reachable from inside a chat's netns (PASS refused / FAIL
      served / SKIP unreachable); the credential model itself is #115's to fix
      and is deliberately unchanged here."
  - id: image-build-is-unpinned-at-the-base
    severity: note
    detail: podman build pulls the OpenCode base image on first run
      (deploy-vps.sh:682-685). config/pins.yaml has exactly one top-level key,
      goose, so whatever the Containerfile's base resolves to on the day of a
      deploy is what ships - the same class of drift the workspace-mcp
      fragment pins away, on a surface nothing here pins.

uninstall:
  supported: false
  reason: "Nothing removes the plane. `systemctl disable code-agent-manager`
    stops new chats, but the podman image, every per-chat volume under
    /data/code-agents, the subuid range and the linger setting all survive,
    and the GitHub PAT must be revoked at GitHub."

notes: >-
  The chat containers are the one part of this setup that hold a credential
  they can spend without a human in the loop (the PAT, as GH_TOKEN, with
  push and pull-request rights). That is why the probe's assertions are about
  ISOLATION - no /data, no stack secrets in the environment - rather than about
  features, and why check-security.sh is run straight after check-code-agents.sh
  in the runbook even though a different unit claims it.
