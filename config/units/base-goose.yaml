---
# base-goose — the pinned goose CLI, its four custom providers, and the
# shipped config template.
#
# DESCRIBES TODAY. unit_base_goose() in scripts/mac/bootstrap-mac.sh installs
# it: the formula, the cask, the pin, the pins.yaml comparison, and the four
# provider JSONs plus config.yaml and .goosehints into ~/.config/goose.
id: base-goose
manifest_version: 1
verified_on: "2026-09-07"
summary: Pinned goose CLI and Desktop cask, four custom providers, config template.
host: mac
tier: base
requires: [base-toolchain, base-secrets]

# Both entries are copied VERBATIM from the "Budget" table in README.md -- the
# two inference rows. The validator re-reads that file and requires `line` and
# `amount` to appear on the same line of it, so no figure can originate here or
# drift from there. The SECTION is cited, never a line number: README.md carries
# two generated regions and a change to either shifts every line below them.
cost:
  - line: OpenCode Zen inference (PAYG — **disable auto-reload, set a cap**)
    amount: ~$5–20/mo typical
    source: README.md
  - line: Together AI inference (min $5 top-up; sensitive tier + default hub)
    amount: ~$5–10/mo
    source: README.md

installer:
  script: scripts/mac/bootstrap-mac.sh
  function: unit_base_goose
  status: present

verify:
  - scripts/verify/check-goose.sh
  - scripts/verify/check-providers.sh
runbook: docs/setup/20-mac-setup.md

# The two names a base-only Mac is prompted for, and the only two: this unit
# and `opencode` are the whole of the default selection that carries a
# mac_keychain row, which is what makes `pai secrets --host mac` print exactly
# these two. `prompt` is what keychain-secrets.sh SHOWS at the hidden prompt --
# there is no second hint table anywhere.
secrets:
  - key: TOGETHER_API_KEY
    store: mac_keychain
    secret: true
    optional: false
    prompt: >-
      Together AI key (docs/setup/10-accounts.md §2) — goose's together provider
      and opencode.json both read it by name
    generate: null
  - key: OPENCODE_ZEN_API_KEY
    # Not an OpenCode-CLI artifact: three of goose's four custom providers name
    # it in api_key_env, so it stays here whatever tier the opencode unit gets.
    store: mac_keychain
    secret: true
    optional: false
    prompt: >-
      OpenCode Zen console key (docs/setup/10-accounts.md §1) — goose's three
      zen providers read it by name
    generate: null

owns:
  - {kind: brew_formula, target: block-goose-cli}
  - {kind: brew_cask, target: block-goose}
  - {kind: repo_file, target: config/goose/config.base.yaml}
  - {kind: repo_file, target: config/goose/config.yaml}
  - {kind: repo_file, target: config/goose/goosehints.example}
  - {kind: home_path, target: ~/.config/goose/config.yaml}
  - {kind: home_path, target: ~/.config/goose/custom_providers}
  - {kind: home_path, target: ~/.config/goose/.goosehints}

manual_steps:
  - id: edit-goosehints
    summary: Replace the <placeholders> in ~/.config/goose/.goosehints with
      your name, email and timezone.
    doc: docs/setup/20-mac-setup.md
    blocking: false

blockers:
  - id: goosehints-not-rendered
    severity: warn
    detail: unit_base_goose() PRINTS a reminder to edit the placeholders
      rather than substituting them. The carve moved that line into the unit
      and changed nothing about it; rendering the placeholders from prompted
      values is a later change (#37).
  - id: brew-pin-asserts-it-cannot-install
    severity: note
    detail: unit_base_goose() COMPARES the installed goose against
      config/pins.yaml's goose.version and warns on a mismatch; it cannot
      install a prior release, because brew has no versioned formula. The
      brain installs the pinned version exactly, so the two surfaces can
      legitimately differ and only one side can honour the pin.

uninstall:
  supported: false
  reason: "`brew pin block-goose-cli` is a machine-global side effect with no
    counterpart, and docs/connecting.md treats the pin as a load-bearing
    invariant."

notes: null
