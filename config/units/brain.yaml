---
# brain — the VPS itself: the Hetzner server terraform creates, the LUKS
# volume everything stateful lives on, goose's whole path root moved onto it,
# and the always-on `goose serve` that Desktop and the phone talk to.
#
# DESCRIBES TODAY. This is the largest single region of deploy-vps.sh —
# deploy-vps.sh:314-516 (preflight + migration), deploy-vps.sh:606-634
# (systemd) and deploy-vps.sh:722-784 (the start and the /status gate) — and it
# STILL has no unit_brain() function, so installer.status is `planned`, an
# assertion that the function does NOT exist. Four of its neighbours now do
# have one; see the blocker below for why this one does not, and why writing
# it would be a mistake rather than a to-do.
#
# tls-cert-renew.{service,timer} is FOLDED IN here rather than made a
# nineteenth unit: it is two files, one `enable --now` at deploy-vps.sh:634,
# and it restarts goose-serve — which is this unit's own service. The price of
# folding it in is that its absence of verification has to be said out loud,
# so it is a blocker below rather than a silent omission.
id: brain
manifest_version: 1
verified_on: "2026-09-07"
summary: Hetzner VPS, LUKS /data, goose's path root on it, and goose-serve over tailnet TLS.
host: vps
tier: opt_in
# tailnet before base-secrets on purpose: cloud-init joins the tailnet at
# first boot, and deploy-vps.sh:357 refuses to run without the tailscale CLI,
# then deploy-vps.sh:764 needs a tailnet IPv4 before it can probe /status at
# all. Both refs name the file: a bare continuation is invisible to the
# `grep -rn 'deploy-vps.sh:[0-9]'` sweep that re-anchors these after a carve,
# which is how the second one here spent a whole PR pointing at unrelated code.
# units_lint.py's P5 now refuses bare continuations of an installer reference.
requires: [tailnet, base-secrets]

# Copied VERBATIM from README.md's budget table (:148). The inference lines on
# that table are base-goose's; this unit is the hardware they run on. The
# validator re-reads README.md and requires `line` and `amount` to appear on
# the same row, so no figure originates here.
cost:
  - line: Hetzner cpx21-class VPS + encrypted volume
    amount: ~€6–9/mo
    source: README.md

installer:
  script: scripts/vps/deploy-vps.sh
  function: unit_brain
  status: planned

# The only unit in the catalog with two verify scripts, and they check
# different things: check-brain.sh asserts the service is up and answering,
# check-security.sh --local asserts /data is really the LUKS mount, that no
# goose path escapes it, and that the live config.yaml carries the extension
# hardening the no-clobber install cannot deliver.
#
# `--local` is written here, not assumed by the runner. check-security.sh's
# other mode is the external port probe, and that one CANNOT be a roster entry:
# it takes the brain's public IP as an argument and, by its own usage text,
# must run from a DIFFERENT machine than the one it is probing. Two modes, one
# script, and this is the mode that is this unit's proof.
verify:
  - scripts/verify/check-brain.sh
  - scripts/verify/check-security.sh --local
runbook: docs/setup/50-vps-brain.md

secrets:
  # goose-serve.service:29 injects the whole of /data/secrets.env, but this is
  # the one key the SERVER itself consumes - it is the shared secret every
  # client presents, and deploy-vps.sh:774 uses it for the /status gate.
  # base-secrets claims the same key as part of the roster it stores; this
  # entry records who READS it. Duplicate claims are legal and deliberate.
  - key: GOOSE_SERVER__SECRET_KEY
    store: vps
    secret: true
    optional: false
    prompt: >-
      shared secret every goose serve client presents; mint it HERE with
      openssl rand -hex 32, then transcribe it into the Mac Keychain and the
      iOS app
    generate: openssl rand -hex 32
  # THE MAC HALF OF THE SAME KEY, and the reason it is filed under a host: vps
  # unit. `store` names where a value lives, not where the unit runs: Desktop
  # and the goose CLI on the Mac authenticate to THIS unit's `goose serve`, so
  # the Mac needs a copy — and only when this unit exists, which is why the row
  # is here and not in a base unit. A base-only Mac must never be prompted for
  # a secret whose server does not exist yet.
  #
  # generate: null on purpose. The value is minted on the brain and TRANSCRIBED
  # here; minting a fresh one on the Mac would unpair the client silently.
  - key: GOOSE_SERVER__SECRET_KEY
    store: mac_keychain
    secret: true
    optional: false
    prompt: >-
      the brain's goose serve shared secret — TRANSCRIBE the value already in
      /data/secrets.env; a fresh one here unpairs Desktop from the brain
    generate: null

owns:
  # ---- the machine. terraform.tfvars and terraform.tfstate are deliberately
  # NOT listed - both are gitignored, and a repo_file target must exist on
  # disk for every checkout, not just the one that ran `terraform apply`.
  - {kind: repo_file, target: infra/terraform/main.tf}
  - {kind: repo_file, target: infra/terraform/variables.tf}
  - {kind: repo_file, target: infra/terraform/outputs.tf}
  - {kind: repo_file, target: infra/terraform/terraform.tfvars.example}
  - {kind: repo_file, target: infra/terraform/templates/cloud-init.yaml.tftpl}
  # ---- the encrypted volume. luks-setup.sh is one-time and DESTRUCTIVE;
  # luks-unlock.sh is the post-reboot path, needed because crypttab/fstab are
  # `noauto` and no key is stored on the machine (luks-setup.sh:9-10).
  - {kind: repo_file, target: scripts/vps/luks-setup.sh}
  - {kind: repo_file, target: scripts/vps/luks-unlock.sh}
  - {kind: data_path, target: /data}
  # GOOSE_PATH_ROOT. deploy-vps.sh:390-516 moves config/, data/ AND state/
  # here (0700) and leaves the three legacy paths as symlinks so the CLI over
  # SSH and the systemd unit read the same files.
  - {kind: data_path, target: /data/goose}
  - {kind: home_path, target: "~/.config/goose (symlink into /data/goose/config)"}
  - {kind: home_path, target: "~/.local/share/goose (symlink into /data/goose/data)"}
  - {kind: home_path, target: "~/.local/state/goose (symlink into /data/goose/state)"}
  # ---- the service, and the cert it serves. /data/tls is written by
  # renew-tls-cert.sh and read by goose-serve.service:61's TLS_ARGS.
  - {kind: repo_file, target: scripts/vps/systemd/goose-serve.service}
  - {kind: systemd_unit, target: goose-serve.service}
  - {kind: repo_file, target: scripts/vps/renew-tls-cert.sh}
  - {kind: repo_file, target: scripts/vps/systemd/tls-cert-renew.service}
  - {kind: repo_file, target: scripts/vps/systemd/tls-cert-renew.timer}
  - {kind: systemd_unit, target: tls-cert-renew.service}
  - {kind: systemd_unit, target: tls-cert-renew.timer}
  - {kind: data_path, target: /data/tls}

manual_steps:
  - id: terraform-apply
    summary: Run `terraform apply` from infra/terraform on the Mac. Nothing in
      either installer creates the server, and the state file stays on the Mac.
    doc: docs/setup/50-vps-brain.md#1-terraform-create-the-infrastructure
    blocking: true
  - id: luks-format-and-mount
    summary: Run `sudo scripts/vps/luks-setup.sh --device ...` once on the
      brain, then luks-unlock.sh after every reboot - the passphrase is never
      stored, so /data cannot come back unattended.
    doc: docs/setup/50-vps-brain.md#3-luks-create-and-mount-the-encrypted-data-one-time
    blocking: true
  - id: issue-first-tls-cert
    summary: Run `sudo scripts/vps/renew-tls-cert.sh` once during setup. The
      timer renews thereafter, but it never issues the first cert on a brain
      that has none.
    doc: docs/setup/50-vps-brain.md#6-deploy-the-stack
    blocking: false
  - id: pin-tls-fingerprint
    summary: Read the serve fingerprint out of journalctl and pin it in Goose
      Desktop; deploy-vps.sh prints the command but cannot do it for you.
    doc: docs/setup/50-vps-brain.md#7-connect-goose-desktop-to-the-brain
    blocking: false

blockers:
  - id: tls-cert-renew-has-no-verify
    severity: warn
    detail: tls-cert-renew.timer is `enable --now`d at deploy-vps.sh:634 and
      its service restarts goose-serve weekly, yet `grep -rn tls-cert-renew
      scripts/verify/` returns NOTHING. No check asserts the timer is armed,
      that /data/tls holds a current cert, or that the two Tailscale
      admin-console prerequisites (MagicDNS, HTTPS Certificates) are still on
      - those are recorded only in renew-tls-cert.sh:6-7. This is the price of
      folding the timer into this unit instead of minting a nineteenth.
  - id: check-security-probe-is-in-no-runner
    severity: warn
    detail: '`pai verify` now derives its roster from this field, so
      check-security.sh --local is finally in a runner (it was in none: the old
      hardcoded roster named brain and code-agents but not security). The
      EXTERNAL port probe still is not, and cannot be - it needs the public IP
      as an argument and must run from a different machine than the brain, so
      no roster entry can supply it. It stays a hand-run command, quoted in
      docs/security.md:52 and docs/setup/70-code-agents.md:81.'
  - id: brain-region-is-not-one-function
    severity: warn
    detail: "This unit deliberately has no unit_brain(). Its code is EIGHT
      non-contiguous regions of deploy-vps.sh interleaved with the four units
      that do have one - preflight, the stop-and-migrate block, the goose
      config install, the systemd unit files, `systemctl enable
      goose-serve`, the trap clear, the restart, the /status gate - and a
      single function wrapping them would either reorder the deploy or hand
      the next author a `want brain || return 0` that must never fire. Nothing
      would then stop `--only automations` from skipping the migration that
      every other unit depends on. The gate surface says so out loud instead:
      every selective run prints `the brain core ... is not selectable and
      always runs`, and so does --help. Do not write unit_brain()."
  - id: what-the-deploy-harness-does-and-does-not-prove
    severity: warn
    detail: "scripts/verify/test-deploy-vps.sh now executes deploy-vps.sh
      against scripts/verify/fake-host.sh, so the claims in this manifest about
      ORDER and ARGV are observed rather than read: the privileged sequence IN
      ORDER (V1 compares the two invocation logs unsorted, against a two-edit
      allowlist; an earlier version sorted them and a whole unit call site could
      move without reddening it), the file tree it writes byte for byte, the
      EXIT trap, idempotence, and a differential against the pre-carve script.
      It proves NOTHING about a real brain. podman, apt-get, systemd, loginctl
      and tailscale are modelled, so
      it cannot tell you that `podman build` succeeds, that rootless subuid
      ranges or linger work, that `systemctl enable --now` on a stale unit is a
      no-op (it asserts only that the reload was ISSUED), or that goose serve
      reads schedule.json only at startup. It is also Linux-only and cannot run
      on the Mac. The post-deploy checks the script's own summary prints -
      check-brain.sh, check-security.sh --local, check-code-agents.sh --probe -
      remain the only evidence about the real host."
  - id: config-install-is-no-clobber
    severity: note
    detail: install_template at deploy-vps.sh:527-536 never overwrites an
      existing config.yaml, so on a brain deployed before a hardening change
      every "differs from repo template" NOTE is hardening that has not landed
      there. check-security.sh --local asserts the LIVE file, which is why
      that script is this unit's second verify rather than an optional extra.

uninstall:
  supported: false
  reason: "`terraform destroy` removes the server and the volume - i.e. every
    session, secret and vault file on it - and there is no smaller lever:
    nothing in the repo disables goose-serve.service or tls-cert-renew.timer,
    unmounts /data, or reverses the GOOSE_PATH_ROOT migration on a host you
    intend to keep."

notes: >-
  The migration at deploy-vps.sh:390-516 is the part of this unit that is
  easiest to under-read. Before it existed only goose's data/ was on the
  encrypted volume; config/ (config.yaml, memory/, secrets.yaml) and state/
  (logs/llm_request.*.jsonl - the RAW request and response bodies exchanged
  with providers, i.e. whole emails) sat on the unencrypted root disk. The
  script says so itself at deploy-vps.sh:513-515, and it says the freed blocks
  are not wiped: a brain deployed before that block ran may still have
  recoverable plaintext on the root disk.
