---
# opencode — the OpenCode CLI (the coding driver) and the one config file the
# bootstrap lays down for it.
#
# DESCRIBES TODAY. unit_opencode() installs it: its own formula list and its
# own ~/.config/opencode. That directory is created THERE and nowhere else, so
# the unit is separable in the code -- but nothing yet lets you ask for the
# install without it, and that is recorded below rather than implied by a
# `default_on` tier that suggests a switch already exists.
id: opencode
manifest_version: 1
verified_on: "2026-09-07"
summary: The OpenCode CLI from anomalyco/tap, ~/.config/opencode/opencode.json, and the Zen credential the bootstrap writes.
host: mac
tier: default_on
requires: [base-goose, base-secrets]

# Copied VERBATIM from README.md's budget table. base-goose claims this SAME
# row, and that is not a double count: it is one Zen account and one bill.
# goose's three Zen custom providers and this CLI spend against it, so the row
# is true of both units and must not be summed across them.
cost:
  - line: OpenCode Zen inference (PAYG — **disable auto-reload, set a cap**)
    amount: ~$5–20/mo typical
    source: README.md

installer:
  script: scripts/mac/bootstrap-mac.sh
  function: unit_opencode
  status: present

# check-opencode.sh is this unit's first verify script (#38). Nine rows: the
# config template, the credential file's existence/mode/contents, the ported
# agents, one real `opencode run`, and three about WHICH opencode the PATH
# resolves to. It exits 2 -- a skip, not a finding -- on a machine with no
# opencode at all. mock-opencode-server.py is unrelated: it serves
# test-code-agent-manager.sh, which drives the BRAIN's containers, not this CLI.
verify: [scripts/verify/check-opencode.sh]
runbook: docs/setup/20-mac-setup.md#3-opencode-zen

secrets:
  # opencode.json:11 reads `{env:TOGETHER_API_KEY}` for the `together`
  # provider, so this CLI needs the same Keychain entry base-goose needs.
  # Secrets are not exclusive the way `owns` is -- one credential legitimately
  # serves several units, and each is checked against its own store's roster.
  - key: TOGETHER_API_KEY
    store: mac_keychain
    secret: true
    optional: false
  # store: none, still, and #39 is what changes it. The Zen key ends up in
  # OpenCode's OWN credential store (~/.local/share/opencode/auth.json), which
  # is neither config/env/secrets.env.example nor keychain-secrets.sh's VARS --
  # a third store this validator cannot read, so claiming `mac_keychain` here
  # would assert a file location that is not where the key ends up. What #38
  # changed is HOW it gets there: scripts/mac/opencode-auth.sh reads
  # $OPENCODE_ZEN_API_KEY out of the environment and writes that file, so the
  # environment is now the input and the Keychain is one hop further back. See
  # the env-only-for-now blocker below.
  - key: OPENCODE_ZEN_API_KEY
    store: none
    secret: true
    optional: false

owns:
  # From FORMULAE_OPENCODE, which unit_opencode() is the only consumer of.
  # brew_formula() strips the tap prefix for its `brew list` probe
  # (`short="${formula##*/}"`), but the install uses the tap-qualified name,
  # which is what is claimed here.
  - {kind: brew_formula, target: anomalyco/tap/opencode}
  - {kind: repo_file, target: config/opencode/opencode.json}
  - {kind: home_path, target: ~/.config/opencode/opencode.json}
  # The credential file, and the script unit_opencode() calls to write it. This
  # is the footprint that used to belong to a TUI: /connect wrote the same path
  # and no manifest could claim it, because no code in this repo put it there.
  - {kind: repo_file, target: scripts/mac/opencode-auth.sh}
  - {kind: home_path, target: ~/.local/share/opencode/auth.json}

manual_steps:
  # connect-zen is GONE, not demoted: scripts/mac/opencode-auth.sh writes
  # ~/.local/share/opencode/auth.json and unit_opencode() calls it, so there is
  # no /connect step left to record. What remains manual is having the key in
  # the environment at all, and that is base-secrets' step, not this unit's.
  #
  # set-default-model STAYS, and it is not a leftover. Writing auth.json
  # addresses the CREDENTIAL; it says nothing about a model OpenCode may have
  # already persisted in its own state from an earlier session. opencode.json
  # pins the defaults for a fresh profile; /models is the repair for a profile
  # that is not fresh.
  #
  # AND THIS ENTRY IS LOAD BEARING ON PROSE ELSEWHERE. I12 in
  # scripts/verify/test-base-install.sh fails while this id exists AND
  # bootstrap-mac.sh's next-steps screen claims there is no /models step -- the
  # exact pair #38 shipped. Delete this step and that claim becomes true again;
  # keep it and the installer has to say so.
  - id: set-default-model
    summary: Type /models and set the daily driver to kimi-k2.6 per
      docs/model-routing.md. opencode.json already pins it, so this is only
      needed if OpenCode has remembered a different choice.
    doc: docs/model-routing.md
    blocking: false

blockers:
  - id: zen-key-is-env-only
    severity: note
    detail: "scripts/mac/opencode-auth.sh reads $OPENCODE_ZEN_API_KEY from the
      ENVIRONMENT only; it does not ask the Keychain. That is #39's job and the
      reason is mechanical rather than aesthetic: a `security` call from a
      bootstrap child lands in $PAI_DENY_LOG, which test-base-install.sh's A5
      and B4 require to be empty, so it would have to be routed through the
      PAI_EXEC seam -- a new fake-exec.sh arm plus a rewrite of fake-brew.sh's
      redaction contract, both holding a live credential, for a value ~/.zshrc
      already exports. Until then the failure mode is: run keychain-secrets.sh,
      forget to open a NEW terminal, and auth.json is not written (the script
      says so and exits 0 rather than failing the bootstrap)."
  - id: install-method-is-brew-but-a-vendor-build-can-shadow-it
    severity: warn
    detail: "install_method is brew (anomalyco/tap/opencode), and that is the
      copy this repo pins. OpenCode's own installer puts a SELF-UPDATING build
      at ~/.opencode/bin/opencode, and on the owner's machine that one is ahead
      of brew's on PATH -- `brew list --versions opencode` said 1.18.19 while
      the binary that ran was 1.18.26. check-opencode.sh's C7 FAILs on exactly
      that and names both paths and versions; nothing here removes the vendor
      install, by design (see the ticket's OUT scope)."
  - id: together-provider-ships-two-model-ids
    severity: note
    detail: "opencode.json:14 and :17 hardcode openai/gpt-oss-120b and
      Qwen/Qwen3.5-397B-A17B for the together provider. sync-models.sh:35
      rewrites config/goose/custom_providers/*.json and never touches this
      file, so a model rename lands here only by hand."

uninstall:
  supported: false
  reason: "`brew uninstall opencode` would leave ~/.config/opencode and
    ~/.local/share/opencode/auth.json behind, and nothing in this repo removes
    either. Deleting them by hand is safe but undocumented."

notes: >-
  The tier split with base-goose is about what BILLS, not about what runs:
  three of goose's four custom providers name OPENCODE_ZEN_API_KEY, so the Zen
  account is load-bearing for base-goose whether or not this CLI is installed.
  That is why base-goose keeps the mac_keychain claim on that key and this
  unit records the separate store OpenCode itself keeps the credential in.
