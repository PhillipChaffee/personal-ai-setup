---
# base-secrets — where credentials live on each host, and the gate that
# refuses to deploy without them.
#
# DESCRIBES TODAY, and the headline fact is an absence: `installer: null`.
# keychain-secrets.sh is a real, working, interactive script that nothing on an
# install path ever runs. bootstrap-mac.sh's next-steps epilogue PRINTS its path
# as step 1 (bootstrap-mac.sh:794) and exits. `grep -rln keychain-secrets
# scripts/ .github/ bin/` names FOURTEEN files and not one installer among them:
# that echo, bootstrap-mac.sh's own usage text (bootstrap-mac.sh:51), `pai`'s
# usage text, comments in doctor.py, units_lint.py and data-lint.yml, the script
# itself, and the advisory strings under scripts/mac/opencode-auth.sh and
# scripts/verify/ that tell a HUMAN to run it. The count is a live assertion
# about the tree, so re-run the command rather than trusting the word: it read
# twelve before #38 added opencode-auth.sh's remedy string and
# test-base-install.sh's I5, which ASSERTS that remedy is printed rather than
# running anything.
#
# THE ONE THING THAT DOES EXECUTE IT IS THE TEST HARNESS: test-pai.sh runs the
# script for real -- under a fake $HOME, a fake `security` and a fake `rm` on
# PATH -- from `kc_run`, `kc_prompted` and the no-terminal arm that closes
# section 10b. Named rather than line-numbered: the three line numbers this
# paragraph carried on the way here (:1913, :1920, :2330) all pointed at the
# pty driver or a fixture by the time anyone read them. That is a harness
# exercising a manual step, not the catalog performing one -- and the paragraph
# says all of this because before #39 it claimed the grep found "no invocation
# anywhere", which running the quoted command disproves.
#
# The Mac half of this unit is a manual step wearing a script's clothes, and
# writing `installer:` here would be the first lie in the catalog.
id: base-secrets
manifest_version: 1
verified_on: "2026-09-07"
summary: Keychain roster on the Mac, /data/secrets.env on the brain, and the deploy gate.
host: both
tier: base
requires: []

# Credentials cost nothing to store. The API keys themselves are billed under
# base-goose's two README rows.
cost: []

# NOTHING INSTALLS THIS UNIT — see the header. Legal only because
# manual_steps below is non-empty, which is the schema's way of forcing the
# absence to be spelled out rather than implied.
installer: null

# NOTHING VERIFIES THIS UNIT EITHER. check-providers.sh:88 and check-goose.sh:43
# both TELL you to run keychain-secrets.sh when a key is missing, but they are
# asserting that a provider works, not that the roster is complete: a Keychain
# holding 4 of the 10 names passes both.
verify: []
runbook: docs/setup/20-mac-setup.md#2-store-your-keys-in-the-keychain

# The four the brain's deploy gate hard-requires at deploy-vps.sh:344-350, and
# exactly what `pai secrets --host vps` prints for the default selection.
# store: vps means "must appear in config/env/secrets.env.example", which is
# the roster deploy-vps.sh tells you to copy. base-goose separately claims
# OPENCODE_ZEN_API_KEY and TOGETHER_API_KEY with store: mac_keychain — the
# same key, two hosts, two stores, and the validator checks each against its
# own source of truth.
#
# `generate` is a property of the ROW, not of the key, and the two here are the
# reason: GOOSE_SERVER__SECRET_KEY is minted on the brain and TRANSCRIBED into
# the Mac Keychain (docs/security.md — re-enter on Desktop and iOS), while
# NTFY_TOPIC runs the other way, minted on the Mac in Phase 1 and transcribed
# here. A per-key `generate` would mint a second value on the wrong host and
# break the pairing silently.
secrets:
  - key: OPENCODE_ZEN_API_KEY
    store: vps
    secret: true
    optional: false
    prompt: >-
      OpenCode Zen console key (docs/setup/10-accounts.md §1) — the same value
      as the Mac Keychain entry
    generate: null
  - key: TOGETHER_API_KEY
    store: vps
    secret: true
    optional: false
    prompt: >-
      Together AI key (docs/setup/10-accounts.md §2) — the same value as the
      Mac Keychain entry
    generate: null
  - key: GOOSE_SERVER__SECRET_KEY
    store: vps
    secret: true
    optional: false
    prompt: >-
      shared secret every goose serve client presents; mint it HERE with
      openssl rand -hex 32, then transcribe it into the Mac Keychain and the
      iOS app
    generate: openssl rand -hex 32
  - key: NTFY_TOPIC
    store: vps
    secret: true
    optional: false
    prompt: >-
      ntfy topic for failure alerts — TRANSCRIBE the value minted on the Mac in
      Phase 1; the name IS the password
    generate: null

owns:
  - {kind: repo_file, target: config/env/secrets.env.example}
  - {kind: repo_file, target: scripts/mac/keychain-secrets.sh}
  # The Keychain service name and the ~/.zshrc export block, both written by
  # keychain-secrets.sh (:41 SERVICE, :43-44 MARKER_BEGIN/MARKER_END). Only
  # the marked block inside ~/.zshrc is this unit's; the rest of the file is
  # the user's -- and when ~/.zshrc is a symlink into a dotfiles repo, the
  # block lands in that repo's file and the link is left alone.
  - {kind: manual, target: "macOS Keychain service: personal-ai"}
  - {kind: home_path, target: "~/.zshrc (personal-ai keychain exports block)"}
  # deploy-vps.sh:323-341 requires this file, fixes its mode to 600, and reads
  # it; it never creates it.
  - {kind: data_path, target: /data/secrets.env}

manual_steps:
  - id: run-keychain-secrets
    summary: Run scripts/mac/keychain-secrets.sh by hand after the bootstrap
      (add --units <id> when you add an opt-in unit), then open a NEW terminal
      so the exports are live.
    doc: docs/setup/20-mac-setup.md#2-store-your-keys-in-the-keychain
    blocking: true
  - id: create-secrets-env
    summary: On the brain, cp config/env/secrets.env.example to
      /data/secrets.env, chmod "0600", and fill in every value.
    doc: docs/setup/50-vps-brain.md
    blocking: true

blockers:
  - id: installer-prints-instead-of-running
    severity: warn
    detail: bootstrap-mac.sh's next-steps epilogue echoes the path to
      keychain-secrets.sh as a step and never executes it, so a bootstrap
      that "succeeds" leaves the Mac with zero credentials stored. The unit
      carve (#37) deliberately did not take this on -- calling an interactive
      secrets prompt from the bootstrap changes both the secrets roster (#39)
      and the install's interactivity contract, so this blocker is reassigned
      rather than discharged.
  - id: no-verify
    severity: warn
    detail: No check-*.sh asserts the Keychain roster is complete or that
      /data/secrets.env holds every name. deploy-vps.sh:344-350 checks four of
      the fourteen at deploy time only, and that check lives in the installer
      rather than in scripts/verify/. Issue 39 added a RUN-level harness
      instead (test-pai.sh section 10 drives keychain-secrets.sh under a fake
      HOME and a fake `security`), which proves the script prompts for exactly
      the manifest roster - not that this machine's Keychain holds the values.
  - id: zshrc-block-is-not-removed-on-deselect
    severity: note
    detail: The ~/.zshrc block is regenerated from the WHOLE catalog roster,
      not from the selection, so deselecting a unit leaves its export line in
      place. That is deliberate (an export of an absent key is an empty string
      by design, and a selection-shaped block would delete the exports of a
      unit installed on an earlier run), but it does mean the block is not a
      record of what is selected.
  - id: telegram-token-was-prompted-unconditionally
    severity: note
    detail: Discharged by issue 39 and recorded because the fix is a behaviour
      change - keychain-secrets.sh:12's VARS prompted for all 10 names on
      every run, including TELEGRAM_BOT_TOKEN and both GOOGLE_OAUTH_* with an
      empty or Phase-2 parenthetical. The roster is now per-unit, so a
      base-only Mac is asked for TOGETHER_API_KEY and OPENCODE_ZEN_API_KEY
      only; the other eight arrive with `--units <id>`.

uninstall:
  supported: false
  reason: "Nothing removes the ~/.zshrc marker block or the Keychain entries.
    Deleting them by hand is safe and documented, but there is no script and
    no `--uninstall` flag, so claiming support here would be untrue."

notes: >-
  The Mac and the brain deliberately do NOT share a mechanism. The Mac has no
  env file at all (a plaintext file of API keys on a laptop is the thing the
  Keychain exists to avoid); the brain has no Keychain and instead keeps
  /data/secrets.env on the LUKS volume, where it is unreadable at rest and
  simply absent until luks-unlock.sh runs. Same names, two stores, on purpose.
