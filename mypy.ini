# mypy configuration — all Python in this repo is typed with dataclasses and
# checked in strict mode; CI enforces it (.github/workflows/python-types.yml).
# Loose dicts are reserved for JSON wire boundaries, validated into
# dataclasses immediately (see the module docstrings).
#
# Companion: ruff.toml (strict lint, every rule enabled) — the other half of
# the Python gate, run by .github/workflows/python-lint.yml.
[mypy]
strict = True
python_version = 3.12
files = scripts/vps/code-agent-manager.py, scripts/verify/mock-opencode-server.py, scripts/verify/fake-github.py, scripts/verify/fake-ntfy.py, scripts/verify/fake-provider.py, scripts/verify/fake-goose-acp.py, scripts/verify/goose_template.py, scripts/verify/units_lint.py, scripts/verify/docs_lint.py, scripts/pai/doctor.py, scripts/pai/goosecfg.py, scripts/pai/uninstall.py
