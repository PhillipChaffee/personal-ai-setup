# Pre-commit gates: secret scanning (this repo is public by design) and the
# strict Python lint that CI enforces anyway — catching it here beats a red
# build. Both hooks mirror a GitHub workflow: secret-scan.yml, python-lint.yml.
#
# One-time setup:
#   pipx install pre-commit   (or: brew install pre-commit)
#   pre-commit install
#
# Manual full run: pre-commit run --all-files
# See docs/public-repo.md for the full go-public checklist.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    # Pinned for reproducibility. Bump periodically with `pre-commit autoupdate`
    # or check https://github.com/gitleaks/gitleaks/releases for the latest tag.
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this rev in lockstep with the pin in .github/workflows/python-lint.yml
    # — the whole rule set is enabled, so versions must not drift.
    rev: v0.15.8
    hooks:
      - id: ruff-check

  # Keep this rev in lockstep with the pin in .github/workflows/data-lint.yml.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # Keep this rev in lockstep with the pin in .github/workflows/shell-lint.yml.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # NEITHER markdown tool runs as a pre-commit hook, deliberately.
  #
  # markdownlint-cli2's hook builds its own node environment, and one of its
  # transitive deps declares engines ^22.22.2 || ^24.15.0 || >=26.0.0 -- so it
  # hard-fails EBADENGINE on a machine running node 24.3, which is a commit
  # blocked by a dev tool's dependency's version range. Every other hook here
  # is python-based and has no such coupling. CI pins node 22 and gates both
  # tools there (.github/workflows/docs-lint.yml).
  #
  # lychee is out for a different reason: its hook downloads a binary and hits
  # the network on every commit.
