# Secret scan over the FULL git history on every push and pull request.
# Second line of defense behind the local gitleaks pre-commit hook —
# this one also catches secrets buried in earlier commits, which matters
# because this repo is public (or about to be).
name: secret-scan

on:
  push:
  pull_request:

# One run per ref per workflow: this repo went from 4 checks to more, and a
# quick follow-up push should cancel the previous run rather than queue behind
# it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# gitleaks-action needs pull-requests:read on pull_request events (it lists
# the PR's commits via the API before scanning); without it the job 403s
# with "Resource not accessible by integration" before any scanning happens.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Nothing in this repo pushes from CI, so the token has no
          # business surviving in .git/config where an artifact upload
          # or a later step could pick it up (zizmor: artipacked).
          persist-credentials: false
          # fetch-depth 0 = every commit, so leaked-then-deleted secrets
          # are still found. A shallow clone would only scan the tip.
          fetch-depth: 0

      # gitleaks reads text. A Terraform saved plan is a ZIP of tfstate +
      # tfconfig + every resolved input variable, so the Tailscale auth key
      # inside one is deflate-compressed: `strings` finds nothing and gitleaks
      # scans it clean. One was tracked here for two weeks on a public repo.
      # The only reliable defence is refusing the PATH, so this is a path
      # check, not a content check.
      - name: No Terraform state or plan files may be tracked
        run: |
          set -euo pipefail
          offenders="$(git ls-files \
            | grep -E '(^|/)(tfplan|terraform\.tfstate)$|\.(tfplan|tfstate)(\.[^/]*)?$' \
            || true)"
          if [ -n "$offenders" ]; then
            echo "::error::Terraform state/plan files are tracked. A saved plan is a ZIP" \
                 "containing every resolved input variable (tailscale_auth_key, hcloud_token)."
            printf '%s\n' "$offenders" | sed 's/^/  /'
            echo "Fix: git rm --cached <file>  (they are gitignored as of this workflow)"
            exit 1
          fi
          echo "No Terraform state or plan files tracked."

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for GitHub *organization* repos;
          # personal-account repos run free. If you move this repo into an
          # org, add the license key as a repo secret:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
