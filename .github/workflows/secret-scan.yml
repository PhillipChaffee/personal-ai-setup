# Secret scanning, in two jobs that scan DIFFERENT things. The distinction is
# the whole point of this file, and getting it wrong is what #76 was about:
#
#   gitleaks   INCREMENTAL, on every push and pull request. gitleaks-action
#              passes --log-opts to bound the scan to the commits in the event
#              (a push of one commit runs `--log-opts=-1`). Fast, and it is what
#              blocks a secret at the moment it is introduced.
#
#   history    THE WHOLE HISTORY, weekly and on demand. Given no event range to
#              bound it, gitleaks scans every commit. This is the one that finds
#              a secret buried in an OLD commit -- which the incremental job
#              cannot, because it only ever saw that commit once, on the day it
#              was pushed, possibly under an older ruleset.
#
# This file used to claim the first job did the second job's work. It did not,
# and `fetch-depth: 0` was paying for history that was then not scanned.
name: secret-scan

on:
  push:
  pull_request:
  schedule:
    # Weekly, Mondays 06:17 UTC. Off the hour because GitHub drops scheduled
    # runs at peak times, and this one has nobody watching for it to not happen.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# One run per ref per workflow: this repo went from 4 checks to more, and a
# quick follow-up push should cancel the previous run rather than queue behind
# it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# gitleaks-action needs pull-requests:read on pull_request events (it lists
# the PR's commits via the API before scanning); without it the job 403s
# with "Resource not accessible by integration" before any scanning happens.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing in this repo pushes from CI, so the token has no
          # business surviving in .git/config where an artifact upload
          # or a later step could pick it up (zizmor: artipacked).
          persist-credentials: false
          # fetch-depth 0 because gitleaks-action computes its scan range from
          # the event and needs the commits behind it present. It does NOT make
          # this job scan the whole history -- the `history` job below does
          # that. This clone is the range's context, not its extent.
          fetch-depth: 0

      # gitleaks reads text. A Terraform saved plan is a ZIP of tfstate +
      # tfconfig + every resolved input variable, so the Tailscale auth key
      # inside one is deflate-compressed: `strings` finds nothing and gitleaks
      # scans it clean. One was tracked here for two weeks on a public repo.
      # The only reliable defence is refusing the PATH, so this is a path
      # check, not a content check.
      - name: No Terraform state or plan files may be tracked
        run: |
          set -euo pipefail
          offenders="$(git ls-files \
            | grep -E '(^|/)(tfplan|terraform\.tfstate)$|\.(tfplan|tfstate)(\.[^/]*)?$' \
            || true)"
          if [ -n "$offenders" ]; then
            echo "::error::Terraform state/plan files are tracked. A saved plan is a ZIP" \
                 "containing every resolved input variable (tailscale_auth_key, hcloud_token)."
            printf '%s\n' "$offenders" | sed 's/^/  /'
            echo "Fix: git rm --cached <file>  (they are gitignored as of this workflow)"
            exit 1
          fi
          echo "No Terraform state or plan files tracked."

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for GitHub *organization* repos;
          # personal-account repos run free. If you move this repo into an
          # org, add the license key as a repo secret:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # THE BACKSTOP. The job above only ever sees a commit once, on the day it is
  # pushed. This one re-reads everything, so a secret that slipped past an older
  # ruleset -- or was committed and then "removed" in a later commit, which does
  # not remove it from history -- is still found.
  history:
    name: gitleaks (full history)
    # Only where it is meaningful. On a push the incremental job has already
    # scanned exactly the new commits, and re-scanning 300 commits on every push
    # would spend minutes to re-derive an answer that has not changed.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Load bearing HERE, unlike above: this job's extent really is the
          # whole history, and a shallow clone would silently scan only the tip.
          fetch-depth: 0

      # The BINARY, not gitleaks-action. The action derives its scan range from
      # the event; run outside a push/pull_request its behaviour is an
      # assumption, and this job's whole value is that its extent is certain.
      # `gitleaks detect` with no --log-opts walks the entire git log.
      #
      # PINNED and checksum-verified, and kept in lockstep with the `rev` in
      # .pre-commit-config.yaml so the hook and the backstop agree on rules.
      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Proves the scan is really full-history BEFORE trusting the real one:
      # a secret in the first commit, deleted in the second. An incremental scan
      # of the tip sees a clean tree. Confined to $RUNNER_TEMP, so the checkout
      # is never modified.
      - name: Negative test — a secret in an OLD commit must be found
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/history-probe"
          rm -rf "$work"; mkdir -p "$work"; cd "$work"
          git init -q .
          git config user.email probe@example.invalid
          git config user.name probe
          # GENERATED, never a literal. A committed secret-shaped constant here
          # would be found by this repo's own pre-commit hook and by the
          # incremental job above -- correctly, since they cannot tell a test
          # fixture from the real thing. It caught exactly that while this was
          # being written. A fresh random value each run is also a slightly
          # better test than a constant an allowlist could learn to skip.
          printf 'api_key = "%s"\n' "$(openssl rand -hex 32)" > s.txt
          git add s.txt && git commit -qm "first: plants it"
          git rm -q s.txt && git commit -qm "second: removes it from the tree"
          rc=0
          gitleaks detect --no-banner --redact --exit-code 1 --source . >/dev/null 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::gitleaks did not find a secret that exists only in an" \
                 "earlier commit — this job is not scanning history"
            exit 1
          fi
          echo "Confirmed: gitleaks finds a secret that survives only in history."

      - name: Run gitleaks over every commit
        run: gitleaks detect --no-banner --redact -v --exit-code 1 --source .
