# ShellCheck over every tracked shell script. 21 files, ~6.5k lines, and until
# this workflow existed none of it was linted by anything -- while the tree
# carried ~90 `# shellcheck disable=` directives for a tool no job ran.
name: shell-lint

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing in this repo pushes from CI, so the token has no
          # business surviving in .git/config where an artifact upload
          # or a later step could pick it up (zizmor: artipacked).
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # shellcheck-py bundles the real binary as a wheel: no Docker, no apt, and
      # it pins like every other tool here. PINNED -- keep in lockstep with the
      # rev in .pre-commit-config.yaml. (shellcheck-py's version does not track
      # shellcheck's: 0.11.0.1 bundles shellcheck 0.11.0.)
      - name: Install ShellCheck
        run: pip install --quiet shellcheck-py==0.11.0.1

      # git ls-files, not find: .claude/worktrees holds untracked copies of
      # these scripts, and linting those would report findings against files no
      # one can fix from this checkout.
      #
      # The list is by SHEBANG OR EXTENSION, not extension alone. bin/pai is a
      # user-facing command and has no business being called pai.sh, so the
      # invariant "nothing with a shell shebang goes unlinted" has to be met by
      # linting it rather than by excusing it. (The guard below used to catch
      # exactly this, and did -- on the PR that added bin/pai.)
      - name: shellcheck
        run: |
          set -euo pipefail
          list="$(mktemp)"
          while IFS= read -r f; do
            case "$f" in *.sh) printf '%s\n' "$f" >>"$list"; continue ;; esac
            if head -1 "$f" 2>/dev/null | grep -qE '^#!.*(bash|/bin/sh|env sh)'; then
              printf '%s\n' "$f" >>"$list"
            fi
          done < <(git ls-files)
          echo "linting $(wc -l <"$list" | tr -d ' ') files:"
          sed 's/^/  /' "$list"
          # A newline-delimited list through xargs, not an unquoted $files:
          # word-splitting a path list is the SC2086 pattern this gate exists
          # to discourage, and it breaks on any path with a space.
          xargs shellcheck --format=gcc <"$list"

      # Belt and braces: the list above is derived from shebangs, so this
      # cannot fire by construction -- it exists so that a future edit which
      # narrows the list back to a bare glob fails loudly instead of silently
      # dropping bin/pai. Mirrors the mypy.ini coverage guard in
      # python-types.yml.
      - name: Every shell script is in the linted set
        run: |
          set -euo pipefail
          missed=""
          while IFS= read -r f; do
            case "$f" in *.sh) continue ;; esac
            head -c 2 "$f" 2>/dev/null | grep -q '#!' || continue
            head -1 "$f" | grep -qE '^#!.*(bash|/bin/sh|env sh)' || continue
            # It has a shell shebang and no .sh -- the lint step must have
            # picked it up by shebang. If that step is ever narrowed back to a
            # bare glob, this is what notices.
            grep -qE '(bash|/bin/sh|env sh)' "$f" || missed="$missed $f"
          done < <(git ls-files)
          if [ -n "$missed" ]; then
            echo "::error::shell scripts not covered by the lint set:$missed"
            exit 1
          fi
          echo "Every tracked shell script is in the linted set."

      - name: Negative test — a real defect must fail the gate
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/broken.sh"
          # shellcheck disable=SC2016  # $1 must reach the probe file unexpanded;
          # expanding it here would write a literal empty string and the probe
          # would be clean, silently turning this negative test into a no-op.
          printf '#!/usr/bin/env bash\nrm -rf $1/\n' > "$probe"
          if shellcheck --format=gcc "$probe"; then
            echo "::error::shellcheck accepted an unquoted rm -rf — the gate is inert"
            exit 1
          fi
          echo "shellcheck correctly rejected an unquoted expansion."
