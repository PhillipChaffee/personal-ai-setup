# Structural gates for the repo's data files. These are the formats that carry
# configuration onto a live machine, so a defect here is a deployment defect,
# not a style nit.
#
# yamllint's load-bearing rule is key-duplicates. PyYAML's safe_load -- the
# idiom scripts/verify/check-connectors.sh uses to validate connector
# manifests -- accepts a duplicated mapping key silently and keeps the LAST
# one, so a duplicated key with a wider allowlist would validate clean and ship
# the wrong tool surface. Verified: safe_load raises nothing on such a file;
# yamllint reports it. The file that makes it concrete is
# config/goose/config.yaml, what deploy-vps.sh copies onto the brain.
#
# That file is now GENERATED -- config/goose/config.base.yaml plus one fragment
# per extension in config/goose/extensions.d/ -- so yamllint alone is no longer
# enough. It still catches a duplicate WITHIN the artifact or within a
# fragment; it cannot see that two fragments each declaring `todoist` compose
# into a duplicated key, and it cannot see whether the committed artifact is
# what those sources compose to at all. check-goose-template.sh, in the yaml
# job below, is the guard for both.
#
# The `connectors` job runs check-connectors.sh --offline, which validates every
# config/connectors/*.yaml against the contract in that directory's README --
# 62 checks in about a second. It was written to run on a machine that has never
# installed goose, yet nothing invoked it: the only reference to it anywhere in
# .github/ was the comment above. A manifest could contradict its own README and
# ship green.
#
# The 62nd check is the ACP method contract, and it was a SKIP here until #34:
# it fetched goose's acp-meta.json from GitHub, and --offline -- the only mode
# any workflow runs -- refuses to. It now asserts against the capture committed
# at config/goose/acp-contract.json, so bumping config/pins.yaml's goose.version
# without re-running `check-connectors.sh --refresh-contract` fails this job,
# naming any ACP method the new goose no longer publishes. The two negative
# tests at the end of that job prove both halves can actually fail.
name: data-lint

on:
  push:
  pull_request:
  schedule:
    # Monthly --strict run for the unit manifests (see the units job).
    - cron: "0 6 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing in this repo pushes from CI, so the token has no
          # business surviving in .git/config where an artifact upload
          # or a later step could pick it up (zizmor: artipacked).
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # PINNED, and kept in lockstep with the rev in .pre-commit-config.yaml.
      - name: Install yamllint
        run: pip install --quiet yamllint==1.38.0
      - name: yamllint
        run: yamllint --strict --format github .

      # Proves the gate can actually fail. Confined to $RUNNER_TEMP so the
      # checkout is never modified.
      - name: Negative test — a duplicated key must fail
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/dup.yaml"
          printf 'a: 1\nb: 2\na: 3\n' > "$probe"
          if yamllint --strict -c .yamllint.yml "$probe"; then
            echo "::error::yamllint accepted a duplicated key — the gate is inert"
            exit 1
          fi
          echo "yamllint correctly rejected a duplicated key."

      # config/goose/config.yaml is a GENERATED artifact: config.base.yaml plus
      # one fragment per extension in config/goose/extensions.d/. yamllint above
      # can only see inside one file at a time, so it cannot tell that the
      # committed artifact is what those sources compose to, nor that two
      # fragments both declare `todoist`. This is that half of the gate.
      # yamllint already drags PyYAML in as a dependency; this pins the version
      # rather than inheriting whatever the resolver picked, and pins it to the
      # same one the connectors job below installs.
      - name: Install PyYAML
        run: pip install --quiet pyyaml==6.0.2

      - name: check-goose-template.sh
        run: scripts/verify/check-goose-template.sh

      # Proves the gate can actually fail. goose_template.py derives its paths
      # from __file__, so running a COPY of the tree out of $RUNNER_TEMP
      # validates that copy and leaves the checkout untouched -- same rule as
      # the two negative tests above.
      - name: Negative test — a hand-edited config.yaml must fail
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/goose-template-negative"
          mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          printf '    hand_edited: true\n' >> "$work/config/goose/config.yaml"
          if "$work/scripts/verify/check-goose-template.sh" >/dev/null 2>&1; then
            echo "::error::check-goose-template.sh accepted a hand-edited config.yaml — the gate is inert"
            exit 1
          fi
          echo "check-goose-template.sh correctly rejected a hand-edited config.yaml."

  connectors:
    name: connector manifests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # The script falls back to `uv run --with pyyaml` when python3 cannot
      # import yaml; installing it directly keeps the job from depending on uv
      # being present on the runner. Pinned like every other tool here.
      - name: Install PyYAML
        run: pip install --quiet pyyaml==6.0.2

      # --offline is the mode that needs no credentials and speaks to nothing:
      # manifest structure, the available_tools allowlist, and the privacy-doc
      # and cloud-init cross-references. Smoke tests and the ACP round trip need
      # a live server and stay out of CI.
      - name: check-connectors.sh --offline
        run: scripts/verify/check-connectors.sh --offline

      # Proves the gate can actually fail. check-connectors.sh derives its
      # CONNECTOR_DIR from BASH_SOURCE, so running a COPY of the tree in
      # $RUNNER_TEMP validates that copy's manifests and leaves the checkout
      # untouched -- same rule as the yamllint negative test above.
      - name: Negative test — a malformed manifest must fail
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/connector-negative"
          mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          printf 'id: broken\nnot_a_valid: manifest\n' \
            > "$work/config/connectors/zz-negative-test.yaml"
          if "$work/scripts/verify/check-connectors.sh" --offline >/dev/null 2>&1; then
            echo "::error::check-connectors.sh accepted a malformed manifest — the gate is inert"
            exit 1
          fi
          echo "check-connectors.sh correctly rejected a malformed manifest."

      # Proves the PIN gate can actually fail. Bumping goose.version alone is
      # the realistic mistake: the vendored ACP contract then describes a tag
      # nobody installs, and nothing offline can re-derive it. Same rule as the
      # tests above -- a copy of the tree in $RUNNER_TEMP, checkout untouched.
      - name: Negative test — a pin bump with a stale ACP contract must fail
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/contract-stale"
          mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          python3 - "$work/config/pins.yaml" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          text = open(path).read()
          open(path, "w").write(re.sub(r'version: "[^"]*"', 'version: "9.99.9"', text, count=1))
          PY
          if out="$("$work/scripts/verify/check-connectors.sh" --offline 2>&1)"; then
            echo "::error::a goose pin bump with a stale ACP contract passed --offline — the gate is inert"
            exit 1
          fi
          printf '%s\n' "$out" | grep -q -- "--refresh-contract" || {
            echo "::error::the stale-contract failure did not name the remedy (--refresh-contract)"
            printf '%s\n' "$out"
            exit 1
          }
          echo "check-connectors.sh correctly rejected a pin bump with a stale ACP contract."

      # And the half that the issue's acceptance criterion is actually about:
      # the human DID re-take the capture at the new tag, and a method this repo
      # calls is gone from it. Failing is not enough -- it has to NAME the
      # method, because "the ACP contract changed" is not a fixable report.
      - name: Negative test — a removed ACP method must fail, by name
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/contract-gone"
          mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          gone="_goose/unstable/config/extensions/set-enabled"
          python3 - "$work" "$gone" <<'PY'
          import hashlib
          import json
          import re
          import sys

          root, gone = sys.argv[1], sys.argv[2]
          contract = root + "/config/goose/acp-contract.json"
          doc = json.load(open(contract))
          doc["tag"] = "v9.99.9"
          doc["methods"] = [m for m in doc["methods"] if m != gone]
          text = json.dumps(doc, indent=2) + "\n"
          open(contract, "w").write(text)

          # Refreshing rewrites the hash too, so a test that skipped this would
          # only ever prove the hash check fires.
          pins = root + "/config/pins.yaml"
          s = open(pins).read()
          s = re.sub(r'version: "[^"]*"', 'version: "9.99.9"', s, count=1)
          s = re.sub(r'acp_contract_sha256: "[^"]*"',
                     'acp_contract_sha256: "%s"' % hashlib.sha256(text.encode()).hexdigest(), s)
          open(pins, "w").write(s)
          PY
          if out="$("$work/scripts/verify/check-connectors.sh" --offline 2>&1)"; then
            echo "::error::an ACP contract missing a method this repo calls passed --offline — the gate is inert"
            exit 1
          fi
          printf '%s\n' "$out" | grep -q "$gone" || {
            echo "::error::the gate failed without NAMING the missing method"
            printf '%s\n' "$out"
            exit 1
          }
          echo "check-connectors.sh correctly named the ACP method a pin bump took away."

  units:
    name: unit manifests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install --quiet pyyaml==6.0.2

      - name: check-units.sh --offline
        run: scripts/verify/check-units.sh --offline

      # AC#5 (#36) used to be discharged here by a text freeze: "the VPS
      # installer is byte-identical to main". THE FREEZE IS GONE, and the
      # property it stood in for is now asserted directly and more strongly.
      #
      # #37 already narrowed the freeze to deploy-vps.sh with the reasoning
      # "bootstrap-mac.sh is what #37 carves into selectable units, so a text
      # freeze on it is a veto on the ticket rather than a statement about
      # behaviour; assertion A14b asserts the property instead". #41 is the same
      # ticket for the brain, and it lands the same replacement: V0/V1/V1b in
      # scripts/verify/test-deploy-vps.sh run the pre-carve deploy-vps.sh (a git
      # blob pinned by sha) and the working tree's against
      # scripts/verify/fake-host.sh, then compare the PRIVILEGED SEQUENCE and
      # the file tree byte for byte, modes and symlink targets included.
      #
      # SEQUENCE, not set, and that distinction is why this freeze may go. The
      # first version of V1 sorted both logs and compared multisets, which is
      # NOT stronger than a text freeze: a pure reordering of the deploy passed
      # it, and the freeze this step used to run would have caught one. V1 now
      # compares the two logs in order, against a two-edit allowlist expressed
      # as a patch, and install-test.yml's `a reordered unit call site must fail
      # V1` step moves a whole unit call site to keep that honest.
      #
      # With that, it is stronger than an empty source diff in both directions:
      # it catches a behaviour change made through a file the freeze did not
      # name (register-schedules.sh, a systemd unit body), and it does not veto
      # a comment. V0 is the other half — an unreachable pinned baseline, or one
      # re-pinned to a post-carve revision, FAILS rather than skipping, so this
      # replacement cannot quietly evaporate the way a deleted step would. It
      # runs in install-test.yml's `brain deploy against fakes` job, which is
      # where the fakes and the fetch-depth: 0 it needs already live.
      # `fetch-depth: 0` is dropped here with the step that needed it.

      # NEGATIVE TEST 1 — an unknown TOP-LEVEL key. Deliberately not the
      # connectors probe's shape: check-connectors.sh makes an unknown top-level
      # key a NOTE, so a straight port of that rule would let this ship GREEN.
      #
      # It greps for the MESSAGE, not just the exit code. The appended file also
      # duplicates base-goose's owns targets, so an exit-code-only assertion
      # would go green off the P4 double-claim even if P1 were deleted.
      - name: Negative test — an unknown top-level key must fail
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/units-negative-key"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          cp "$work/config/units/base-goose.yaml" "$work/config/units/zz-probe.yaml"
          printf 'id: zz-probe\nnot_a_valid: manifest\n' >> "$work/config/units/zz-probe.yaml"
          if out="$("$work/scripts/verify/check-units.sh" --offline 2>&1)"; then
            echo "::error::check-units.sh accepted an unknown top-level key — the gate is inert"
            exit 1
          fi
          printf '%s\n' "$out" | grep -qF "FAIL  unknown top-level key(s) in zz-probe.yaml" || {
            echo "::error::check-units.sh failed, but not for the unknown key — P1 is inert"
            printf '%s\n' "$out"
            exit 1
          }
          echo "check-units.sh correctly rejected an unknown top-level key."

      # NEGATIVE TEST 2 — the 180-day arm, which is entirely new code (nothing
      # in this repo computes an age window today).
      #
      # THE GREP IS LOAD-BEARING, not decoration. `--strict` also promotes the
      # two reverse-closure checks, and those cannot pass until all 18 manifests
      # exist — measured: `check-units.sh --strict` exits 1 with 16 findings on
      # a clean tree today. So an exit-code-only assertion here would go green
      # with the staleness code DELETED. Matching the `FAIL  ` prefix is also
      # what distinguishes the --strict verdict from the --offline NOTE.
      - name: Negative test — a stale verified_on must fail under --strict
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/units-negative-stale"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          stale="$(python3 -c 'import datetime as d; print(d.datetime.now(tz=d.UTC).date() - d.timedelta(days=181))')"
          sed -i "s/^verified_on: .*/verified_on: \"$stale\"/" \
            "$work/config/units/base-goose.yaml"
          if out="$("$work/scripts/verify/check-units.sh" --strict 2>&1)"; then
            echo "::error::check-units.sh accepted a 181-day-old verified_on — the gate is inert"
            exit 1
          fi
          printf '%s\n' "$out" | grep -qE "^FAIL  base-goose\.verified_on $stale is 181 days old" || {
            echo "::error::--strict failed, but not on the stale date — the staleness gate is inert"
            printf '%s\n' "$out"
            exit 1
          }
          # And the other half of the design: the SAME date must only be a NOTE
          # in the required job. If staleness ever hard-FAILs --offline, the
          # whole catalog goes red on one calendar day for whoever pushes next.
          "$work/scripts/verify/check-units.sh" --offline >/dev/null 2>&1 || {
            echo "::error::a stale verified_on FAILED --offline; it must be a NOTE there"
            exit 1
          }
          echo "check-units.sh fails a stale date under --strict and only notes it offline."

      # NEGATIVE TEST 3 — P3, the assertion that runs backwards.
      #
      # INVERTED by #37, and it had to be. The old control seded base-goose's
      # `status: planned` to `present` against a tree where no unit_*() existed
      # yet. Now that unit_base_goose() exists and the manifest says `present`,
      # that sed matches nothing, check-units.sh passes, and the step would
      # report the gate as inert when the only inert thing is the sed. So the
      # mutation moved to the other side of the assertion: rename the FUNCTION
      # out of the installer and leave the manifest claiming `present`. The
      # property under test is identical (a `present` status whose function is
      # not there must FAIL) and the grep string below is unchanged.
      - name: Negative test — installer.status present without the function must fail
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/units-negative-installer"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          sed -i "s/^unit_base_goose() {/unit_base_goose_removed() {/" \
            "$work/scripts/mac/bootstrap-mac.sh"
          if out="$("$work/scripts/verify/check-units.sh" --offline 2>&1)"; then
            echo "::error::check-units.sh accepted status: present for a function that does not exist"
            exit 1
          fi
          printf '%s\n' "$out" | grep -qF "unit_base_goose() is defined 0 times" || {
            echo "::error::the gate failed without naming the missing installer function"
            printf '%s\n' "$out"
            exit 1
          }
          echo "check-units.sh correctly rejected a 'present' status with no function."

      # NEGATIVE TEST 4 — P8(f), the arm that RUNS bootstrap-mac.sh instead of
      # reading it.
      #
      # P8(a)-(d) are regexes anchored on `^NAME="..."`, so they see the table's
      # string LITERALS. Between those literals and anything a user sees sits a
      # `case` dispatch (requires_of/owns_of), chosen over `${!ref}` because an
      # indirectly-read global is SC2034 to shellcheck and a warning is a red
      # gate in this repo. This mutation is one word inside that dispatch, and
      # it leaves every literal in the file untouched: `--only base-goose` then
      # plans a ONE-unit install with no uv, no node, no jq and no tailscale,
      # while unit_base_goose()'s pins ladder still falls back to `uv run`.
      #
      # Measured on the tree before P8(f) existed: this exact sed left
      # check-units.sh green AND scripts/verify/test-base-install.sh at
      # "49 passed, 0 failed". That is what makes it worth a step.
      #
      # It greps for the MESSAGE. An exit-code-only assertion would go green off
      # any other finding the sed happened to provoke.
      - name: Negative test — a case arm that ignores its REQUIRES_* must fail
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/units-negative-dispatch"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          # shellcheck disable=SC2016  # $REQUIRES_BASE_GOOSE is the bash text
          # being matched, not a variable this step reads: it has to reach sed
          # unexpanded, so the pattern is single-quoted on purpose.
          sed -i 's|^\(    base-goose)     printf .%s. \)"\$REQUIRES_BASE_GOOSE"|\1""|' \
            "$work/scripts/mac/bootstrap-mac.sh"
          # The sed must have BITTEN. A pattern that silently stopped matching
          # (the arm reformatted, the variable renamed) would leave the tree
          # pristine, check-units.sh green, and this step reporting P8(f) as
          # inert when the only inert thing is the sed.
          grep -qF 'base-goose)     printf '"'"'%s'"'"' ""' \
            "$work/scripts/mac/bootstrap-mac.sh" || {
            echo "::error::the requires_of mutation did not apply — this control is inert"
            exit 1
          }
          if out="$("$work/scripts/verify/check-units.sh" --offline 2>&1)"; then
            echo "::error::check-units.sh accepted a requires_of arm that drops its own dependency"
            exit 1
          fi
          # `--` before the pattern: it starts with two dashes, so grep would
          # otherwise read it as an option, exit 2 with its own usage, and this
          # step would report P8(f) as inert. (Measured: that is exactly how it
          # failed first. Same trap as test-base-install.sh's F4.)
          printf '%s\n' "$out" | grep -qF -- "--only base-goose plans 1 unit(s)" || {
            echo "::error::the gate failed without naming the dispatch — P8(f) is inert"
            printf '%s\n' "$out"
            exit 1
          }
          echo "check-units.sh correctly rejected a case arm that ignores its REQUIRES_*."

      # NEGATIVE TEST 5 — P5's ban on bare installer line references.
      #
      # The rule exists because #37 and #41 each re-anchored every prefixed
      # `deploy-vps.sh:NNN` and each left the BARE continuations pointing at
      # unrelated code, and a bare ref is invisible to the grep that finds
      # them. The mutation is therefore the exact regression: turn a
      # written-out reference back into a continuation. It must break even
      # though the number itself is still perfectly in range, because range is
      # not the property under test.
      - name: Negative test — a bare installer line reference must fail
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/units-negative-lineref"; rm -rf "$work"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          before="$(grep -c 'then deploy-vps.sh:764 needs a tailnet IPv4' "$work/config/units/brain.yaml")"
          [ "$before" -eq 1 ] \
            || { echo "::error::the anchor line is gone (found $before) — this control is inert"; exit 1; }
          sed -i 's|then deploy-vps.sh:764 needs a tailnet IPv4|then :764 needs a tailnet IPv4|' \
            "$work/config/units/brain.yaml"
          if out="$("$work/scripts/verify/check-units.sh" --offline 2>&1)"; then
            echo "::error::check-units.sh accepted a bare ':764' continuation of a deploy-vps.sh reference"
            exit 1
          fi
          printf '%s\n' "$out" | grep -qF "continues a deploy-vps.sh reference as a bare ':764'" || {
            echo "::error::the gate failed without naming the bare reference"
            printf '%s\n' "$out"
            exit 1
          }
          echo "check-units.sh correctly rejected a bare installer line reference."

      # NEGATIVE TEST 6 — P6's Mac arm, which had to be REPLACED rather than
      # kept. Before #39 it read "a store: mac_keychain key must appear in
      # keychain-secrets.sh's VARS"; that script now takes its roster FROM this
      # field, so the old rule would have compared the generator with itself and
      # could never fail again. What replaces it is a closure over the one
      # Mac-Keychain roster a human still writes by hand — the credential
      # checklist in 10-accounts.md — and this proves it fires.
      #
      # The mutation is on the DOC side on purpose: it is the direction that
      # says "the reader was told to store a key nothing prompts for", which is
      # the bug the arm was written after (TODOIST_API_KEY, which
      # store: goose_secret_store forbids from both global rosters).
      - name: Negative test — the doc's Mac Keychain column must match the manifests
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/units-negative-maccol"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          doc="$work/docs/setup/10-accounts.md"
          sed -i 's/| `TODOIST_API_KEY` | no | no |/| `TODOIST_API_KEY` | yes | yes |/' "$doc"
          # A sed that matched nothing makes this whole step a green no-op, and
          # this table's cells move. Assert the mutation landed before running.
          grep -qF '| `TODOIST_API_KEY` | yes | yes |' "$doc" || {
            echo "::error::the TODOIST row moved — this negative test is no longer mutating anything"
            exit 1
          }
          if out="$("$work/scripts/verify/check-units.sh" --offline 2>&1)"; then
            echo "::error::check-units.sh accepted a doc that stores a key no unit declares"
            exit 1
          fi
          printf '%s\n' "$out" | grep -qF "says TODOIST_API_KEY lives in the Mac Keychain" || {
            echo "::error::the gate failed, but not on the Mac Keychain column — P6's doc closure is inert"
            printf '%s\n' "$out"
            exit 1
          }
          echo "check-units.sh correctly rejected a credential table that disagrees with the manifests."

      # NEGATIVE TEST 7 — the empty parenthetical, in the one place it can now
      # be introduced. keychain-secrets.sh's hint table is gone; a hintless
      # prompt can only come from a manifest row whose `prompt` says nothing,
      # and a SINGLE SPACE is the shape that renders as `( )` and slips past any
      # "is it empty" grep. Python rather than sed because the prompts are
      # folded YAML blocks, and a sed that mangled the file would fail the gate
      # for the wrong reason.
      - name: Negative test — a blank prompt must fail
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/units-negative-prompt"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          python3 - "$work/config/units/base-goose.yaml" <<'PY'
          import pathlib, sys
          import yaml
          path = pathlib.Path(sys.argv[1])
          data = yaml.safe_load(path.read_text())
          assert data["secrets"], "base-goose has no secrets rows to blank"
          data["secrets"][0]["prompt"] = " "
          path.write_text(yaml.safe_dump(data, sort_keys=False))
          PY
          if out="$("$work/scripts/verify/check-units.sh" --offline 2>&1)"; then
            echo "::error::check-units.sh accepted a whitespace-only prompt — the '( )' bug can come back"
            exit 1
          fi
          printf '%s\n' "$out" | grep -qF ".prompt must be a non-empty string" || {
            echo "::error::the gate failed, but not on the blank prompt"
            printf '%s\n' "$out"
            exit 1
          }
          echo "check-units.sh correctly rejected a prompt of one space."

      # The monthly run. continue-on-error until the catalog closes: --strict
      # also promotes the two REVERSE-closure checks, and every check-*.sh and
      # every secrets.env.example key is unclaimable until all 18 manifests
      # exist. A scheduled job that is red on arrival trains people to ignore
      # it — the same argument that makes staleness a NOTE in the required job.
      # FLIP THIS TO false IN THE PR THAT ADDS THE REMAINING 15 MANIFESTS; the
      # seven negative tests above are what keep --strict honest until then.
      - name: check-units.sh --strict (monthly)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: scripts/verify/check-units.sh --strict

  # The rosters that used to be literals, and the harness that keeps them
  # honest: `pai verify`'s check list (now every manifest's `verify:`),
  # check-mcp.sh's three hardcoded services (now the live config's enabled MCP
  # extensions) and check-brain.sh's five schedules (now register-schedules.sh's
  # ORDER=(). All offline, against generated fixtures, no goose and no network.
  #
  # It lives here rather than in a new checks.yml because these are structural
  # gates over the repo's own data files, which is what this workflow is.
  rosters:
    name: derived rosters (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install --quiet pyyaml==6.0.2

      - name: test-verify-checks.sh
        run: scripts/verify/test-verify-checks.sh

      - name: brain's second verify script is in the derived roster
        run: |
          set -euo pipefail
          roster="$(bin/pai units --field verify)"
          printf '%s\n' "$roster" | grep -qF "scripts/verify/check-security.sh --local" || {
            echo "::error::brain.yaml's second verify script is not in the derived roster"
            printf '%s\n' "$roster"
            exit 1
          }
          echo "the roster is derived, and check-security.sh --local is in it."

      # NEGATIVE TESTS, and they grep the MESSAGE rather than only the exit
      # code. An exit-code-only assertion goes green off some other finding,
      # which is how a gate becomes inert while still passing — the warning
      # install-test.yml's two negatives already carry.
      - name: Negative test — an unreadable manifest must refuse the sweep
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/rosters-negative"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          printf 'this is not yaml: [unclosed\n' > "$work/config/units/zz-broken.yaml"
          if out="$("$work/bin/pai" verify 2>&1)"; then
            echo "::error::pai verify swept a roster it could not fully read"
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | grep -qF "zz-broken" || {
            echo "::error::the refusal did not name the manifest it could not read"
            printf '%s\n' "$out"
            exit 1
          }
          echo "pai verify correctly refused a roster with an unreadable manifest."

      # The sweep of NOTHING. `pai units --field verify` exits 0 with empty
      # stdout when config/units/ is absent, so before the guard this printed
      # "== summary: 0 passed, 0 failed, 0 skipped ==" and exited 0 — a green
      # `pai verify` that ran no check at all. The grep is what distinguishes it
      # from every other exit-2 refusal this command has.
      - name: Negative test — an empty roster must refuse the sweep
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/rosters-negative-empty"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          rm -rf "$work/config/units"
          if out="$("$work/bin/pai" verify 2>&1)"; then
            echo "::error::pai verify reported success with an EMPTY roster — it ran nothing"
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | grep -qF "is EMPTY" || {
            echo "::error::pai verify failed, but not about the empty roster"
            printf '%s\n' "$out"
            exit 1
          }
          echo "pai verify correctly refused an empty roster."

      - name: Negative test — an enabled MCP extension with no smoke test must fail
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/rosters-negative-mcp"; mkdir -p "$work"
          cat > "$work/config.yaml" <<'EOF'
          extensions:
            zz-new-connector:
              name: zz-new-connector
              type: stdio
              cmd: uvx
              enabled: true
          EOF
          printf '#!/usr/bin/env bash\nexit 0\n' > "$work/goose"
          chmod +x "$work/goose"
          if out="$(PAI_GOOSE_CONFIG="$work/config.yaml" GOOSE_BIN="$work/goose" \
              scripts/verify/check-mcp.sh 2>&1)"; then
            echo "::error::check-mcp.sh passed an enabled extension it has no smoke test for"
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | grep -qF "zz-new-connector is enabled and declares an MCP server" || {
            echo "::error::check-mcp.sh failed, but not for the missing smoke test — the rule is inert"
            printf '%s\n' "$out"
            exit 1
          }
          echo "check-mcp.sh correctly failed an enabled extension with no smoke test."
