# A full Mac base install, on a Linux runner, with no Mac, no VPS and no keys.
#
# bootstrap-mac.sh is the one program in this repo whose entire job is side
# effects on external systems, and until now nothing could execute it: it exits
# 1 on non-Darwin, and every step it takes runs `brew`. It is now routed through
# a single substitutable binary (PAI_EXEC), exactly as the code-agent manager is
# routed through CODE_AGENT_ENGINE, so the whole install can be driven against
# fakes that assert on what it invoked.
#
# All the logic lives in scripts/verify/test-base-install.sh, not here. A
# python3 heredoc inside a `run:` block is invisible to ruff, mypy and the
# tracked-file scans, and cannot be run on a laptop -- which is where this gets
# debugged.
name: install-test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-install:
    name: base install against fakes
    runs-on: ubuntu-latest
    # The only workflow here that sets one. This job starts a background HTTP
    # fake and runs three full bootstraps; if any of that ever wedges, the
    # default six hours of a hung runner is a poor way to find out.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing in this repo pushes from CI, so the token has no
          # business surviving in .git/config where an artifact upload
          # or a later step could pick it up (zizmor: artipacked).
          persist-credentials: false
          # LOAD BEARING, AND ASSERTED (#111, carried through the automations
          # removal). Assertion A17 in test-base-install.sh (the OTHER job)
          # parses THIS FILE and requires every actions/checkout step in it to
          # set fetch-depth: 0 -- so removing this line fails the job it
          # degrades. The negative test below ("full history must be asserted,
          # not just commented") is the proof.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # bootstrap-mac.sh branches on `python3 -c 'import yaml'` and falls back
      # to `uv run --with pyyaml` -- but uv here is a fake, so without this the
      # pin comparison takes its "could not compare ... skipping" arm and BOTH
      # of its real arms (match and mismatch) go untested. The harness asserts
      # this is present and dies with a named message if not. Pinned to match
      # data-lint.yml.
      - name: Install PyYAML
        run: pip install --quiet pyyaml==6.0.2

      - name: Base install against the fakes
        run: scripts/verify/test-base-install.sh

      # The two negative tests below prove this gate can FAIL. Both work on a
      # COPY extracted into $RUNNER_TEMP, so the checkout is never modified --
      # the same rule data-lint.yml and secret-scan.yml follow.
      #
      # `test -x` first, deliberately: a script committed with mode 100644
      # would make the whole negative test a silent no-op that always "passes".
      - name: Negative test — a formula-list change must fail the golden
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-formula"
          rm -rf "$work"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          test -x "$work/scripts/verify/test-base-install.sh" \
            || { echo "::error::harness is not executable in the archive"; exit 1; }
          # Re-anchored for #37: the single $FORMULAE is now one list per unit.
          # The anchor is a top-level global for exactly this reason -- a list
          # that had moved inside a unit function would still be sed-able, but
          # `^FORMULAE_BASE_TOOLCHAIN=` would match nothing, the harness would
          # pass on an UNMODIFIED script, and this step would report that the
          # golden is inert when the only inert thing is the sed.
          sed -i 's|^FORMULAE_BASE_TOOLCHAIN=.*|FORMULAE_BASE_TOOLCHAIN="uv node jq docker"|' \
            "$work/scripts/mac/bootstrap-mac.sh"
          if "$work/scripts/verify/test-base-install.sh" --only brew; then
            echo "::error::the brew golden accepted an extra formula — assertion A1" \
                 "is inert and the formula list is unguarded"
            exit 1
          fi
          echo "The golden correctly rejected an unannounced formula-list change."

      - name: Negative test — an unrouted external call must fail
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-routing"
          rm -rf "$work"; mkdir -p "$work"
          # `cp -a` and not `git archive` (#111's rule for this job). An archive
          # export has no .git at all; the A14b differential that used to need
          # one died with the OpenCode unit, but the rule is kept -- a copy
          # runs exactly what is checked out, and `git archive HEAD` would run
          # whatever HEAD holds on a broken laptop tree. test-deploy-vps.sh's
          # reorder control below records the same lesson.
          cp -a "$GITHUB_WORKSPACE/." "$work/"
          test -x "$work/scripts/verify/test-base-install.sh" \
            || { echo "::error::harness is not executable in the copy"; exit 1; }
          # Take one call back OUT of the seam. The deny-PATH must catch it even
          # though this particular shape swallows its own exit status, which is
          # precisely what no grep over the source could reliably find.
          #
          # Re-anchored for #37: the pin lives inside unit_base_goose() now, so
          # the line is INDENTED and a `^if` anchor would match nothing -- the
          # harness would then pass on an unmodified script and this step would
          # report the deny-PATH as inert when the only inert thing is the sed.
          # The capture group keeps whatever indentation the carve gave it.
          sed -i 's|^\( *\)if pai_exec brew list --pinned|\1if brew list --pinned|' \
            "$work/scripts/mac/bootstrap-mac.sh"
          grep -q '^ *if brew list --pinned' "$work/scripts/mac/bootstrap-mac.sh" \
            || { echo "::error::the sed matched nothing — unit_base_goose() no longer probes" \
                      "the pin on that line, so this control is inert and would have passed" \
                      "on an unmodified tree"; exit 1; }
          # AND IT GREPS THE MESSAGE (#111). `--only routing` has more ways
          # to exit 1 than one -- A17 is in this leg too -- and
          # only "FAIL  A5:" means the deny-PATH caught the call that left the
          # seam.
          out="$RUNNER_TEMP/neg-routing.log"
          if "$work/scripts/verify/test-base-install.sh" --only routing >"$out" 2>&1; then
            echo "::error::an unrouted brew call went unnoticed — the deny-PATH" \
                 "invariant is inert"
            exit 1
          fi
          grep -q '^FAIL  A5:' "$out" \
            || { echo "::error::--only routing failed, but not at A5 — the negative test" \
                      "is going red for some other reason:"; sed 's/^/  /' "$out"; exit 1; }
          echo "The deny-PATH correctly caught a call that left the seam."

      # THE #111 CONTROL THAT SURVIVES THE PIVOT (#142). A14b, the pre-carve
      # output differential, died with the OpenCode unit -- no pinned
      # pre-pivot baseline can match a tree that deliberately installs one unit
      # fewer -- so three of the four controls below used to be about it and
      # are gone. What remains is A17: the one precondition the harness cannot
      # establish for itself, asserted against the workflow text.
      - name: Negative test — full history must be asserted, not just commented
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-fetch-depth"
          rm -rf "$work"; mkdir -p "$work"
          cp -a "$GITHUB_WORKSPACE/." "$work/"
          test -x "$work/scripts/verify/test-base-install.sh" \
            || { echo "::error::harness is not executable in the copy"; exit 1; }
          # ONE LINE, the way it would actually be lost: someone tidies the
          # checkout block of THIS job and takes `fetch-depth: 0` with it.
          # Before #111 the only symptom was the differentials quietly
          # skipping on every run; today V1 (below) is the differential the
          # depth feeds, and A17 is what notices.
          wf="$work/.github/workflows/install-test.yml"
          before="$(grep -c '^          fetch-depth: 0$' "$wf")"
          [ "$before" -eq 2 ] \
            || { echo "::error::expected exactly 2 'fetch-depth: 0' lines, found $before —" \
                      "this control is inert"; exit 1; }
          # The FIRST one: this job's own checkout.
          sed -i '0,/^          fetch-depth: 0$/{/^          fetch-depth: 0$/d}' "$wf"
          [ "$(grep -c '^          fetch-depth: 0$' "$wf")" -eq 1 ] \
            || { echo "::error::the delete removed the wrong number of lines — this control is inert"; exit 1; }
          out="$RUNNER_TEMP/neg-fetch-depth.log"
          if "$work/scripts/verify/test-base-install.sh" --only routing >"$out" 2>&1; then
            echo "::error::a checkout step lost fetch-depth: 0 and nothing noticed — the deploy" \
                 "differential would skip on every CI run from here on, with the badge still green"
            exit 1
          fi
          grep -q '^FAIL  A17:' "$out" \
            || { echo "::error::--only routing failed, but not at A17:"; sed 's/^/  /' "$out"; exit 1; }
          echo "A17 correctly caught a checkout that stopped fetching history."

  # The brain's deploy, on the same terms: a program whose entire job is side
  # effects, executed against fakes. It gets its own job rather than another
  # step because it shares nothing with the Mac install -- different seam
  # (PAI_* roots vs PAI_EXEC), different fake, different assertions -- and
  # because a red deploy should not be reported as "base install failed".
  #
  # WHAT GREEN HERE MEANS: the deploy stops goose-serve before the first move
  # into the path root, installs then reloads then restarts the manager, always
  # links with -T, runs the migration once whatever is selected, honours
  # --with/--without/--only, refuses a unit id that is not in the catalog,
  # re-runs clean, blocks on a dead /status and attributes a failing unit by
  # name. The pre-carve sequence differential that used to sit on top of these
  # was retired with the automations removal (#143) — see the harness header
  # for what replaced it. It says NOTHING about whether podman, apt, systemd,
  # rootless subuid ranges or loginctl linger behave as modelled on a real
  # Ubuntu, and nothing at all about a real brain. The harness's header
  # enumerates that list; read it before trusting this badge.
  deploy-vps:
    name: brain deploy against fakes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # ALSO COVERED BY A17 (#111), which lives in the OTHER job's harness on
          # purpose: A17 parses this whole file and requires fetch-depth: 0 on
          # every actions/checkout step in it, including this one. A job cannot
          # assert its own shallowness away -- from inside a depth-1 checkout
          # "CI stopped fetching history" and "someone ran this on a shallow
          # laptop clone" are the same observation.
          fetch-depth: 0

      - name: Brain deploy against the fakes
        run: scripts/verify/test-deploy-vps.sh

      # Seven negative tests, each naming the assertion it must break. All work
      # on a COPY in $RUNNER_TEMP so the checkout is never modified, and all
      # use INDENTATION-TOLERANT anchors: the carve moved most of these lines
      # inside a function body, and a `^sudo` anchor would match nothing, pass
      # on an unmodified script, and report the gate as inert when the only
      # inert thing is the sed. install-test.yml:107-113 records that lesson.
      #
      # `test -x` first, deliberately: a harness committed 100644 would make
      # every one of these a silent no-op that always "passes".
      - name: Negative test — a migration without the stop must fail V2a
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-stop"
          rm -rf "$work"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          test -x "$work/scripts/verify/test-deploy-vps.sh" \
            || { echo "::error::harness is not executable in the archive"; exit 1; }
          before="$(grep -c '^ *sudo systemctl stop goose-serve\.service$' "$work/scripts/vps/deploy-vps.sh" || true)"
          [ "$before" -eq 1 ] \
            || { echo "::error::expected exactly 1 migration stop, found $before — this control is inert"; exit 1; }
          sed -i '/^ *sudo systemctl stop goose-serve\.service$/d' "$work/scripts/vps/deploy-vps.sh"
          if "$work/scripts/verify/test-deploy-vps.sh" --only constraints; then
            echo "::error::the migration ran under a live goose and V2a did not notice"
            exit 1
          fi
          echo "V2a correctly caught a migration that ran under a live goose."

      - name: Negative test — ln without -T must fail
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-ln"
          rm -rf "$work"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          test -x "$work/scripts/verify/test-deploy-vps.sh" \
            || { echo "::error::harness is not executable in the archive"; exit 1; }
          sed -i 's|ln -sfnT|ln -sfn|g' "$work/scripts/vps/deploy-vps.sh"
          if "$work/scripts/verify/test-deploy-vps.sh" --only constraints; then
            echo "::error::a symlink can now nest inside a surviving directory and V3 did not notice"
            exit 1
          fi
          echo "V3 correctly rejected ln without -T."

      - name: Negative test — a missing unit gate must fail
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-gate"
          rm -rf "$work"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          test -x "$work/scripts/verify/test-deploy-vps.sh" \
            || { echo "::error::harness is not executable in the archive"; exit 1; }
          before="$(grep -c 'want code-agents' "$work/scripts/vps/deploy-vps.sh")"
          sed -i '/^ *want code-agents || return 0$/d' "$work/scripts/vps/deploy-vps.sh"
          after="$(grep -c 'want code-agents' "$work/scripts/vps/deploy-vps.sh" || true)"
          [ "$before" -eq 1 ] && [ "$after" -eq 0 ] \
            || { echo "::error::the sed did not remove the gate (before=$before after=$after) — this control is inert"; exit 1; }
          if "$work/scripts/verify/test-deploy-vps.sh" --only select; then
            echo "::error::--without code-agents installed podman anyway and V5 did not notice"
            exit 1
          fi
          echo "V5 correctly caught a unit that ignored its gate."

      - name: Negative test — the manager's reload must stay between install and restart
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-reload-unit"
          rm -rf "$work"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          test -x "$work/scripts/verify/test-deploy-vps.sh" \
            || { echo "::error::harness is not executable in the archive"; exit 1; }
          # The ONE in-unit reload: unit_code_agents'. Removing it must break
          # V2c. (The gateway's reload died with the gateway itself.)
          before="$(grep -c '^  sudo systemctl daemon-reload$' "$work/scripts/vps/deploy-vps.sh" || true)"
          [ "$before" -eq 1 ] \
            || { echo "::error::expected exactly 1 in-unit daemon-reload, found $before — this control is inert"; exit 1; }
          sed -i '/^  sudo systemctl daemon-reload$/d' "$work/scripts/vps/deploy-vps.sh"
          if "$work/scripts/verify/test-deploy-vps.sh" --only constraints; then
            echo "::error::a unit restarts what it just installed without reloading, and V2c did not notice"
            exit 1
          fi
          echo "V2c correctly caught a unit that restarted a cached unit file."

      - name: Negative test — a unit id removed from the catalog must not come back silently
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-catalog"
          rm -rf "$work"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          test -x "$work/scripts/verify/test-deploy-vps.sh" \
            || { echo "::error::harness is not executable in the archive"; exit 1; }
          # The automations pivot deleted three unit ids. If someone edits one
          # back into UNIT_IDS without a body to run, --without <id> would go
          # from "refused" to "accepted and a no-op" — and V5b is what notices.
          before="$(grep -c '^UNIT_IDS=' "$work/scripts/vps/deploy-vps.sh" || true)"
          [ "$before" -eq 1 ] \
            || { echo "::error::expected exactly 1 UNIT_IDS line, found $before — this control is inert"; exit 1; }
          sed -i 's|^UNIT_IDS="code-agents"|UNIT_IDS="code-agents telegram-gateway"|' \
            "$work/scripts/vps/deploy-vps.sh"
          grep -q 'UNIT_IDS="code-agents telegram-gateway"' "$work/scripts/vps/deploy-vps.sh" \
            || { echo "::error::the sed matched nothing — this control is inert"; exit 1; }
          if "$work/scripts/verify/test-deploy-vps.sh" --only select; then
            echo "::error::a unit id that no longer has an installer body was accepted, and V5b did not notice"
            exit 1
          fi
          echo "V5b correctly refused a unit id without an installer body."

      # THE ORDERING CONTROL over the install/restart pair, and the reason V2c
      # is allowed to be the only guard on it: this is the mutation that proves
      # the ordering assertion is about POSITION, not presence. Moving the
      # reload ABOVE its install re-reddens V2c identically, so a later author
      # cannot hoist it and call the gate green.
      - name: Negative test — the manager reload must stay below its install
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-reload-position"
          rm -rf "$work"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          test -x "$work/scripts/verify/test-deploy-vps.sh" \
            || { echo "::error::harness is not executable in the archive"; exit 1; }
          src="$work/scripts/vps/deploy-vps.sh"
          cp "$src" "$src.orig"
          # The install and the in-unit reload are ADJACENT lines, so the
          # mutation is an adjacent swap: hold the install, and when the reload
          # that followed it arrives, emit the reload FIRST. The reload now
          # precedes its install, V2c's first_idx_after finds no reload below
          # the install, and the assertion re-reddens.
          awk '
            /^  sudo install -m 644 .*code-agent-manager\.service/ { hold = $0; pending = 1; next }
            pending && /^  sudo systemctl daemon-reload$/ { print; print hold; pending = 0; swapped = 1; next }
            { if (pending) { print hold; pending = 0 }; print }
            END { if (!swapped) exit 3 }
          ' "$src.orig" > "$src" \
            || { echo "::error::the move did not apply — this control is inert"; exit 1; }
          chmod 755 "$src"
          [ "$(sort "$src" | sha256sum)" = "$(sort "$src.orig" | sha256sum)" ] \
            || { echo "::error::the mutation changed the script's lines, not just their order — this control tests the wrong thing"; exit 1; }
          rm -f "$src.orig"
          if "$work/scripts/verify/test-deploy-vps.sh" --only constraints; then
            echo "::error::the manager was restarted against a cached unit definition and V2c did not notice"
            exit 1
          fi
          echo "V2c correctly caught a reload that moved above its install."

      - name: Negative test — enable --now for the manager must fail
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-enable-now"
          rm -rf "$work"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          test -x "$work/scripts/verify/test-deploy-vps.sh" \
            || { echo "::error::harness is not executable in the archive"; exit 1; }
          sed -i 's|^\( *\)sudo systemctl restart code-agent-manager\.service$|\1sudo systemctl enable --now code-agent-manager.service|' \
            "$work/scripts/vps/deploy-vps.sh"
          grep -q 'enable --now code-agent-manager' "$work/scripts/vps/deploy-vps.sh" \
            || { echo "::error::the sed matched nothing — this control is inert"; exit 1; }
          if "$work/scripts/verify/test-deploy-vps.sh" --only constraints; then
            echo "::error::--now is a no-op on a running unit, and V2e did not notice"
            exit 1
          fi
          echo "V2e correctly rejected 'enable --now' for the manager."
