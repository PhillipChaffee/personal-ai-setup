# A full Mac base install, on a Linux runner, with no Mac, no VPS and no keys.
#
# bootstrap-mac.sh is the one program in this repo whose entire job is side
# effects on external systems, and until now nothing could execute it: it exits
# 1 on non-Darwin, and every step it takes runs `brew`. It is now routed through
# a single substitutable binary (PAI_EXEC), exactly as the code-agent manager is
# routed through CODE_AGENT_ENGINE, so the whole install can be driven against
# fakes that assert on what it invoked.
#
# All the logic lives in scripts/verify/test-base-install.sh, not here. A
# python3 heredoc inside a `run:` block is invisible to ruff, mypy and the
# tracked-file scans, and cannot be run on a laptop -- which is where this gets
# debugged.
name: install-test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-install:
    name: base install against fakes
    runs-on: ubuntu-latest
    # The only workflow here that sets one. This job starts a background HTTP
    # fake and runs three full bootstraps; if any of that ever wedges, the
    # default six hours of a hung runner is a poor way to find out.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing in this repo pushes from CI, so the token has no
          # business surviving in .git/config where an artifact upload
          # or a later step could pick it up (zizmor: artipacked).
          persist-credentials: false
          # LOAD BEARING, AND ASSERTED (#111). Assertion A14b runs the PRE-CARVE
          # bootstrap-mac.sh, which it reads out of git history by pinned sha,
          # and diffs the $HOME it installs against the one this checkout
          # installs. actions/checkout defaults to depth 1; on a shallow clone
          # that blob is absent, A14b0 takes its one permitted SKIP arm and "the
          # carve changed no behaviour" would be asserted on a laptop and nowhere
          # else, with nothing going red.
          #
          # Deleting this line used to be exactly that silent degradation. It is
          # now assertion A17 in test-base-install.sh, which parses THIS FILE and
          # requires every actions/checkout step in it to set fetch-depth: 0 --
          # so the deletion fails the job it degrades. The negative test below
          # ("full history must be asserted, not just commented") is the proof.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # bootstrap-mac.sh branches on `python3 -c 'import yaml'` and falls back
      # to `uv run --with pyyaml` -- but uv here is a fake, so without this the
      # pin comparison takes its "could not compare ... skipping" arm and BOTH
      # of its real arms (match and mismatch) go untested. The harness asserts
      # this is present and dies with a named message if not. Pinned to match
      # data-lint.yml.
      - name: Install PyYAML
        run: pip install --quiet pyyaml==6.0.2

      - name: Base install against the fakes
        run: scripts/verify/test-base-install.sh

      # The two negative tests below prove this gate can FAIL. Both work on a
      # COPY extracted into $RUNNER_TEMP, so the checkout is never modified --
      # the same rule data-lint.yml and secret-scan.yml follow.
      #
      # `test -x` first, deliberately: a script committed with mode 100644
      # would make the whole negative test a silent no-op that always "passes".
      - name: Negative test — a formula-list change must fail the golden
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-formula"
          rm -rf "$work"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          test -x "$work/scripts/verify/test-base-install.sh" \
            || { echo "::error::harness is not executable in the archive"; exit 1; }
          # Re-anchored for #37: the single $FORMULAE is now one list per unit.
          # The anchor is a top-level global for exactly this reason -- a list
          # that had moved inside a unit function would still be sed-able, but
          # `^FORMULAE_BASE_TOOLCHAIN=` would match nothing, the harness would
          # pass on an UNMODIFIED script, and this step would report that the
          # golden is inert when the only inert thing is the sed.
          sed -i 's|^FORMULAE_BASE_TOOLCHAIN=.*|FORMULAE_BASE_TOOLCHAIN="uv node jq docker"|' \
            "$work/scripts/mac/bootstrap-mac.sh"
          if "$work/scripts/verify/test-base-install.sh" --only brew; then
            echo "::error::the brew golden accepted an extra formula — assertion A1" \
                 "is inert and the formula list is unguarded"
            exit 1
          fi
          echo "The golden correctly rejected an unannounced formula-list change."

      - name: Negative test — an unrouted external call must fail
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-routing"
          rm -rf "$work"; mkdir -p "$work"
          # `cp -a` and not `git archive`, alone among this job's three (#111).
          # `--only routing` runs A14b, which reads the pre-carve blob out of
          # .git by pinned sha, and an archive export has no .git at all. That
          # used to be a counted SKIP; A14b0 now fails on it, correctly -- which
          # would make this step go red on an UNMODIFIED tree and report the
          # deny-PATH as inert when the only inert thing is the sed. The other
          # two steps run --only brew / --only opencode, which never enter the
          # structural leg, so they are unaffected. test-deploy-vps.sh's reorder
          # control below records the same lesson.
          cp -a "$GITHUB_WORKSPACE/." "$work/"
          test -x "$work/scripts/verify/test-base-install.sh" \
            || { echo "::error::harness is not executable in the copy"; exit 1; }
          # Take one call back OUT of the seam. The deny-PATH must catch it even
          # though this particular shape swallows its own exit status, which is
          # precisely what no grep over the source could reliably find.
          #
          # Re-anchored for #37: the pin lives inside unit_base_goose() now, so
          # the line is INDENTED and a `^if` anchor would match nothing -- the
          # harness would then pass on an unmodified script and this step would
          # report the deny-PATH as inert when the only inert thing is the sed.
          # The capture group keeps whatever indentation the carve gave it.
          sed -i 's|^\( *\)if pai_exec brew list --pinned|\1if brew list --pinned|' \
            "$work/scripts/mac/bootstrap-mac.sh"
          grep -q '^ *if brew list --pinned' "$work/scripts/mac/bootstrap-mac.sh" \
            || { echo "::error::the sed matched nothing — unit_base_goose() no longer probes" \
                      "the pin on that line, so this control is inert and would have passed" \
                      "on an unmodified tree"; exit 1; }
          # AND IT GREPS THE MESSAGE (#111). `--only routing` now has more ways
          # to exit 1 than it did -- A14b0 and A17 are both in this leg -- and
          # only "FAIL  A5:" means the deny-PATH caught the call that left the
          # seam. The opencode step below has greped its id since #38.
          out="$RUNNER_TEMP/neg-routing.log"
          if "$work/scripts/verify/test-base-install.sh" --only routing >"$out" 2>&1; then
            echo "::error::an unrouted brew call went unnoticed — the deny-PATH" \
                 "invariant is inert"
            exit 1
          fi
          grep -q '^FAIL  A5:' "$out" \
            || { echo "::error::--only routing failed, but not at A5 — the negative test" \
                      "is going red for some other reason:"; sed 's/^/  /' "$out"; exit 1; }
          echo "The deny-PATH correctly caught a call that left the seam."

      # THE THIRD NEGATIVE TEST (#38). Take the unattended auth back out of
      # unit_opencode() and require phase I to notice. (Phase I, not F: #37's
      # flag surface took F/G/H first — see the note at the top of
      # test-base-install.sh.)
      #
      # IT PROVES ITS OWN SED FIRST, and that is the difference between this
      # step and a green no-op. Both steps above carry a comment warning that a
      # re-anchored `sed` which stops matching makes the whole step pass on an
      # UNMODIFIED tree; here that is checked rather than warned about — the
      # replacement leaves a marker, and a missing marker is an ::error:: in its
      # own right. The `test -x` guard is kept for the same reason it is above.
      #
      # AND IT GREPS THE MESSAGE, not just the exit code. `--only opencode`
      # exits 1 for any of twenty reasons; only "FAIL  I1:" means the assertion
      # that is supposed to catch this caught it.
      - name: Negative test — removing the unattended auth must fail phase I
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-opencode"
          rm -rf "$work"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          test -x "$work/scripts/verify/test-base-install.sh" \
            || { echo "::error::harness is not executable in the archive"; exit 1; }
          test -x "$work/scripts/mac/opencode-auth.sh" \
            || { echo "::error::opencode-auth.sh is not executable in the archive"; exit 1; }
          # `[$]` rather than `\$`: POSIX leaves `\$` inside a BRE undefined,
          # and an anchor that resolves differently on two seds is exactly the
          # silent no-op this step is written to avoid.
          sed -i 's|^ *"[$]SCRIPT_DIR/opencode-auth[.]sh"$|  : # PAI-NEG-AUTH-REMOVED|' \
            "$work/scripts/mac/bootstrap-mac.sh"
          grep -q 'PAI-NEG-AUTH-REMOVED' "$work/scripts/mac/bootstrap-mac.sh" \
            || { echo "::error::the sed matched nothing — unit_opencode() no longer calls" \
                      "opencode-auth.sh on that line, so this negative test is inert and" \
                      "would have passed on an unmodified tree"; exit 1; }
          out="$RUNNER_TEMP/neg-opencode.log"
          if "$work/scripts/verify/test-base-install.sh" --only opencode >"$out" 2>&1; then
            echo "::error::the bootstrap installed OpenCode without authenticating it and" \
                 "phase I stayed green — I1 is inert"
            exit 1
          fi
          grep -q '^FAIL  I1:' "$out" \
            || { echo "::error::--only opencode failed, but not at I1 — the negative test" \
                      "is going red for some other reason:"; sed 's/^/  /' "$out"; exit 1; }
          echo "Phase I correctly caught an OpenCode install with no credential."

      # ------------------------------------------------------------------ #111
      # FOUR CONTROLS ON THE DIFFERENTIAL'S OWN PRECONDITIONS. Everything above
      # proves the harness catches a bad INSTALLER. These prove it catches a bad
      # HARNESS -- specifically the four ways A14b used to stop asserting
      # anything while the badge stayed green. Each names the id it must break
      # and greps for it, because `--only routing` exits 1 for a dozen reasons
      # and "it went red" is not evidence that the control under test fired.
      #
      # All four use `cp -a`, never `git archive`: three of them are ABOUT git
      # history, and the fourth needs a .git to make a shallow clone from.
      - name: Negative test — an unreachable pin must FAIL, not skip
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-pin-gone"
          rm -rf "$work"; mkdir -p "$work"
          cp -a "$GITHUB_WORKSPACE/." "$work/"
          test -x "$work/scripts/verify/test-base-install.sh" \
            || { echo "::error::harness is not executable in the copy"; exit 1; }
          # Stands in for the squash that orphans the pinned commit, without
          # needing to rewrite history: a well-formed sha that names no object
          # is indistinguishable to `cat-file -e` from one that has been gc'd.
          # The clone is FULL, so the shallow arm must not be taken.
          sed -i 's|^\( *\)PRE_CARVE_SHA=.*|\1PRE_CARVE_SHA="deadbeefdeadbeefdeadbeefdeadbeefdeadbeef"|' \
            "$work/scripts/verify/test-base-install.sh"
          grep -q '^ *PRE_CARVE_SHA="deadbeef' "$work/scripts/verify/test-base-install.sh" \
            || { echo "::error::the sed matched nothing — this control is inert"; exit 1; }
          [ "$(git -C "$work" rev-parse --is-shallow-repository)" = "false" ] \
            || { echo "::error::the copy is shallow, so this tests the SKIP arm, not the FAIL arm"; exit 1; }
          out="$RUNNER_TEMP/neg-pin-gone.log"
          if "$work/scripts/verify/test-base-install.sh" --only routing >"$out" 2>&1; then
            echo "::error::the pre-carve blob was unreachable in a FULL clone and the harness" \
                 "still exited 0 — A14b asserted nothing and nothing went red"
            exit 1
          fi
          grep -q '^FAIL  A14b0: deadbeefd:scripts/mac/bootstrap-mac.sh is UNREACHABLE' "$out" \
            || { echo "::error::--only routing failed, but not at A14b0's unreachable arm:"; \
                 sed 's/^/  /' "$out"; exit 1; }
          if grep -q '^SKIP' "$out"; then
            echo "::error::an unreachable pin was reported as a SKIP — the arms are still collapsed"
            exit 1
          fi
          echo "A14b0 correctly failed on a pin that names no object."

      - name: Negative test — a pin moved onto a post-carve commit must fail
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-pin-moved"
          rm -rf "$work"; mkdir -p "$work"
          cp -a "$GITHUB_WORKSPACE/." "$work/"
          test -x "$work/scripts/verify/test-base-install.sh" \
            || { echo "::error::harness is not executable in the copy"; exit 1; }
          # THE SUBTLE ONE. This is what an author does to make a dangling pin
          # go green: re-point it at the branch head. The blob is then reachable,
          # every "is it there" check passes, and A14b diffs the working tree
          # against itself -- a differential that can never fail again. Only the
          # SHAPE check (no unit_*() definitions) can tell the difference.
          head_sha="$(git -C "$work" rev-parse HEAD)"
          sed -i "s|^\( *\)PRE_CARVE_SHA=.*|\1PRE_CARVE_SHA=\"$head_sha\"|" \
            "$work/scripts/verify/test-base-install.sh"
          grep -q "^ *PRE_CARVE_SHA=\"$head_sha\"" "$work/scripts/verify/test-base-install.sh" \
            || { echo "::error::the sed matched nothing — this control is inert"; exit 1; }
          git -C "$work" cat-file -e "$head_sha:scripts/mac/bootstrap-mac.sh" \
            || { echo "::error::the re-pinned sha is not reachable, so this tests the" \
                      "unreachable arm and not the post-carve one"; exit 1; }
          out="$RUNNER_TEMP/neg-pin-moved.log"
          if "$work/scripts/verify/test-base-install.sh" --only routing >"$out" 2>&1; then
            echo "::error::the baseline was re-pinned onto a POST-carve commit and the harness" \
                 "exited 0 — A14b is now comparing the working tree with itself"
            exit 1
          fi
          grep -q '^FAIL  A14b0: .* is reachable but is NOT a pre-carve revision' "$out" \
            || { echo "::error::--only routing failed, but not at A14b0's shape check:"; \
                 sed 's/^/  /' "$out"; exit 1; }
          echo "A14b0 correctly refused a baseline that has the carve already in it."

      - name: Negative test — full history must be asserted, not just commented
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-fetch-depth"
          rm -rf "$work"; mkdir -p "$work"
          cp -a "$GITHUB_WORKSPACE/." "$work/"
          test -x "$work/scripts/verify/test-base-install.sh" \
            || { echo "::error::harness is not executable in the copy"; exit 1; }
          # ONE LINE, the way it would actually be lost: someone tidies the
          # checkout block of THIS job and takes `fetch-depth: 0` with it. Before
          # #111 the only symptom was A14b quietly skipping on every run.
          wf="$work/.github/workflows/install-test.yml"
          before="$(grep -c '^          fetch-depth: 0$' "$wf")"
          [ "$before" -eq 2 ] \
            || { echo "::error::expected exactly 2 'fetch-depth: 0' lines, found $before —" \
                      "this control is inert"; exit 1; }
          # The FIRST one: this job's own, the one A14b depends on.
          sed -i '0,/^          fetch-depth: 0$/{/^          fetch-depth: 0$/d}' "$wf"
          [ "$(grep -c '^          fetch-depth: 0$' "$wf")" -eq 1 ] \
            || { echo "::error::the delete removed the wrong number of lines — this control is inert"; exit 1; }
          out="$RUNNER_TEMP/neg-fetch-depth.log"
          if "$work/scripts/verify/test-base-install.sh" --only routing >"$out" 2>&1; then
            echo "::error::a checkout step lost fetch-depth: 0 and nothing noticed — A14b would" \
                 "skip on every CI run from here on, with the badge still green"
            exit 1
          fi
          grep -q '^FAIL  A17:' "$out" \
            || { echo "::error::--only routing failed, but not at A17:"; sed 's/^/  /' "$out"; exit 1; }
          echo "A17 correctly caught a checkout that stopped fetching history."

      - name: Negative test — a shallow clone may skip, and only because it is listed
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/shallow-src"; work="$RUNNER_TEMP/neg-shallow"
          rm -rf "$src" "$work"; mkdir -p "$src"
          cp -a "$GITHUB_WORKSPACE/." "$src/"
          # A branch, because a depth-1 clone needs a ref to clone: the workspace
          # is on a detached HEAD for pull_request events. --no-local forces the
          # real transport (git silently ignores --depth on a local path copy),
          # and --no-tags keeps refs/tags/mac-pre-carve from dragging the pinned
          # object back in -- which is the whole point of the tag, and exactly
          # what must NOT happen in the case under test here.
          git -C "$src" branch -f pai-shallow-src HEAD
          git clone --quiet --depth 1 --no-local --no-tags \
            --branch pai-shallow-src "file://$src" "$work"
          [ "$(git -C "$work" rev-parse --is-shallow-repository)" = "true" ] \
            || { echo "::error::the clone is not shallow — this control is inert"; exit 1; }
          # THE .git COMES FROM THE CLONE; THE FILES COME FROM THE WORKSPACE.
          # A clone checks out the COMMIT, so without this the step would run
          # whatever harness is committed rather than the one under test -- and
          # a run of this control against the pre-#111 harness stayed green for
          # exactly that reason. Same rule as A14b's "the new side is $REPO_ROOT,
          # never `git archive HEAD`", for the same reason.
          tar -C "$GITHUB_WORKSPACE" --exclude=./.git -cf - . | tar -C "$work" -xf -
          cmp -s "$GITHUB_WORKSPACE/scripts/verify/test-base-install.sh" \
                 "$work/scripts/verify/test-base-install.sh" \
            || { echo "::error::the shallow clone is not running the harness under test —" \
                      "this control is inert"; exit 1; }
          # PART 1: a listed skip is a skip. Exit 0, and it says so out loud.
          out="$RUNNER_TEMP/neg-shallow.log"
          "$work/scripts/verify/test-base-install.sh" --only routing >"$out" 2>&1 \
            || { echo "::error::a genuinely shallow clone must SKIP A14b and exit 0, not fail:"; \
                 sed 's/^/  /' "$out"; exit 1; }
          grep -q '^SKIP  A14b0: A14b did not run: this is a SHALLOW clone' "$out" \
            || { echo "::error::the shallow clone exited 0 without taking the skip arm — A14b" \
                      "may have run against a blob it should not have had:"; sed 's/^/  /' "$out"; exit 1; }
          # PART 2: and it is a skip ONLY because A14b0 is on the allowlist.
          # Take it off and the identical run must fail, which is what makes the
          # list a decision rather than a comment.
          sed -i 's|^SKIPPABLE=.*|SKIPPABLE=""|' "$work/scripts/verify/test-base-install.sh"
          grep -q '^SKIPPABLE=""$' "$work/scripts/verify/test-base-install.sh" \
            || { echo "::error::the sed matched nothing — this control is inert"; exit 1; }
          out2="$RUNNER_TEMP/neg-shallow-unlisted.log"
          if "$work/scripts/verify/test-base-install.sh" --only routing >"$out2" 2>&1; then
            echo "::error::an unlisted assertion skipped and the harness still exited 0 —" \
                 "the skip allowlist is inert"
            exit 1
          fi
          grep -q '^FAIL  A14b0: .*IS NOT ON THIS HARNESS' "$out2" \
            || { echo "::error::the unlisted skip did not fail as an unlisted skip:"; \
                 sed 's/^/  /' "$out2"; exit 1; }
          echo "A shallow clone skips because A14b0 is listed, and fails when it is not."

  # The brain's deploy, on the same terms: a program whose entire job is side
  # effects, executed against fakes. It gets its own job rather than another
  # step because it shares nothing with the Mac install -- different seam
  # (PAI_* roots vs PAI_EXEC), different fake, different assertions -- and
  # because a red deploy differential should not be reported as "base install
  # failed".
  #
  # WHAT GREEN HERE MEANS: deploy-vps.sh issues the privileged invocations it
  # issued before the carve, IN THE SAME ORDER, with two enumerated edits (one
  # `daemon-reload` moved below the tls-cert-renew installs, one added inside
  # unit_telegram_gateway), and a strictly smaller sequence when a unit is
  # deselected. The comparison is sequence-exact, not set-exact: an earlier
  # version sorted both logs first, and a whole unit call site could be moved
  # without reddening it. It says NOTHING about whether podman, apt, systemd,
  # rootless subuid ranges or loginctl linger behave as modelled on a real
  # Ubuntu, and nothing at all about a real brain. The harness's header
  # enumerates that list; read it before trusting this badge.
  deploy-vps:
    name: brain deploy against fakes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # LOAD BEARING, for the same reason as the job above. Assertion V1
          # runs the PRE-CARVE deploy-vps.sh out of git history by pinned sha
          # and diffs its privileged sequence and its file tree against this
          # checkout's. A SHALLOW clone is the one case the harness is allowed
          # to SKIP -- so without this, "the carve changed nothing" would be
          # asserted nowhere and the job would still be green. (An unreachable
          # sha, e.g. after a squash merge, is a FAILURE rather than a skip;
          # fetch-depth cannot help with that one and does not pretend to.)
          #
          # ALSO COVERED BY A17 (#111), which lives in the OTHER job's harness on
          # purpose: A17 parses this whole file and requires fetch-depth: 0 on
          # every actions/checkout step in it, including this one. A job cannot
          # assert its own shallowness away -- from inside a depth-1 checkout
          # "CI stopped fetching history" and "someone ran this on a shallow
          # laptop clone" are the same observation.
          fetch-depth: 0

      - name: Brain deploy against the fakes
        run: scripts/verify/test-deploy-vps.sh

      # Six negative tests, each naming the assertion it must break. All work
      # on a COPY in $RUNNER_TEMP so the checkout is never modified, and all
      # use INDENTATION-TOLERANT anchors: the carve moved most of these lines
      # inside a function body, and a `^sudo` anchor would match nothing, pass
      # on an unmodified script, and report the gate as inert when the only
      # inert thing is the sed. install-test.yml:107-113 records that lesson.
      #
      # `test -x` first, deliberately: a harness committed 100644 would make
      # every one of these a silent no-op that always "passes".
      - name: Negative test — enable --now for the manager must fail
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-enable-now"
          rm -rf "$work"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          test -x "$work/scripts/verify/test-deploy-vps.sh" \
            || { echo "::error::harness is not executable in the archive"; exit 1; }
          sed -i 's|^\( *\)sudo systemctl restart code-agent-manager\.service$|\1sudo systemctl enable --now code-agent-manager.service|' \
            "$work/scripts/vps/deploy-vps.sh"
          grep -q 'enable --now code-agent-manager' "$work/scripts/vps/deploy-vps.sh" \
            || { echo "::error::the sed matched nothing — this control is inert"; exit 1; }
          if "$work/scripts/verify/test-deploy-vps.sh" --only constraints; then
            echo "::error::--now is a no-op on a running unit, and V2e did not notice"
            exit 1
          fi
          echo "V2e correctly rejected 'enable --now' for the manager."

      - name: Negative test — ln without -T must fail
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-ln"
          rm -rf "$work"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          test -x "$work/scripts/verify/test-deploy-vps.sh" \
            || { echo "::error::harness is not executable in the archive"; exit 1; }
          sed -i 's|ln -sfnT|ln -sfn|g' "$work/scripts/vps/deploy-vps.sh"
          if "$work/scripts/verify/test-deploy-vps.sh" --only constraints; then
            echo "::error::a symlink can now nest inside a surviving directory and V3 did not notice"
            exit 1
          fi
          echo "V3 correctly rejected ln without -T."

      - name: Negative test — a missing unit gate must fail
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-gate"
          rm -rf "$work"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          test -x "$work/scripts/verify/test-deploy-vps.sh" \
            || { echo "::error::harness is not executable in the archive"; exit 1; }
          before="$(grep -c 'want code-agents' "$work/scripts/vps/deploy-vps.sh")"
          sed -i '/^ *want code-agents || return 0$/d' "$work/scripts/vps/deploy-vps.sh"
          after="$(grep -c 'want code-agents' "$work/scripts/vps/deploy-vps.sh" || true)"
          [ "$before" -eq 1 ] && [ "$after" -eq 0 ] \
            || { echo "::error::the sed did not remove the gate (before=$before after=$after) — this control is inert"; exit 1; }
          if "$work/scripts/verify/test-deploy-vps.sh" --only select; then
            echo "::error::--without code-agents installed podman anyway and V5 did not notice"
            exit 1
          fi
          echo "V5 correctly caught a unit that ignored its gate."

      - name: Negative test — the tls-cert-renew reload must stay below its installs
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-reload-tls"
          rm -rf "$work"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          test -x "$work/scripts/verify/test-deploy-vps.sh" \
            || { echo "::error::harness is not executable in the archive"; exit 1; }
          # Column 0 anchors the UNCONDITIONAL reload specifically: the other
          # two live inside unit bodies and are indented. Deleting it leaves
          # `enable --now tls-cert-renew.timer` with no reload of its own
          # anywhere above it.
          #
          # NOT the pre-PR tree, and an earlier version of this comment said it
          # was: before this PR a reload DID exist here, sitting ABOVE the two
          # tls installs, which is the bug the move fixes. Deletion is used
          # instead of a move because it is the sed that cannot half-apply; the
          # true move mutation reddens V2b' identically, so this control is
          # sensitive to POSITION and not merely to presence.
          before="$(grep -c '^sudo systemctl daemon-reload$' "$work/scripts/vps/deploy-vps.sh")"
          [ "$before" -eq 1 ] \
            || { echo "::error::expected exactly 1 top-level daemon-reload, found $before — this control is inert"; exit 1; }
          sed -i '/^sudo systemctl daemon-reload$/d' "$work/scripts/vps/deploy-vps.sh"
          if "$work/scripts/verify/test-deploy-vps.sh" --only constraints; then
            echo "::error::tls-cert-renew.timer is armed against a stale unit file and V2b' did not notice"
            exit 1
          fi
          echo "V2b' correctly caught a reload that moved above its installs."

      - name: Negative test — the in-unit reloads must stay between install and enable
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-reload-unit"
          rm -rf "$work"; mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          test -x "$work/scripts/verify/test-deploy-vps.sh" \
            || { echo "::error::harness is not executable in the archive"; exit 1; }
          # The two INDENTED reloads: unit_telegram_gateway's (this PR's other
          # bug fix) and unit_code_agents' (which predates it). Removing both
          # must break V2b and V2c.
          before="$(grep -c '^  sudo systemctl daemon-reload$' "$work/scripts/vps/deploy-vps.sh")"
          [ "$before" -eq 2 ] \
            || { echo "::error::expected exactly 2 in-unit daemon-reloads, found $before — this control is inert"; exit 1; }
          sed -i '/^  sudo systemctl daemon-reload$/d' "$work/scripts/vps/deploy-vps.sh"
          if "$work/scripts/verify/test-deploy-vps.sh" --only constraints; then
            echo "::error::a unit enables what it just installed without reloading, and V2b/V2c did not notice"
            exit 1
          fi
          echo "V2b/V2c correctly caught a unit that enabled a cached unit file."

      # THE ORDERING CONTROL, and the reason V1 is allowed to be the only guard
      # on deploy-vps.sh now that data-lint.yml's text freeze is gone. V2a-f pin
      # six specific pairs; V1 pins the whole sequence, and this is the mutation
      # that proves it. It moves a WHOLE UNIT CALL SITE — no line is added,
      # removed or edited — which the previous, `sort`-then-`comm` version of V1
      # reported as a pass.
      #
      # `cp -a` and not `git archive`, alone among these six: V1 reads the
      # pre-carve blob out of .git by pinned sha, and an archive export has no
      # .git at all. (The harness fails loudly rather than skipping in that
      # case, which is why the other five, which run --only constraints/select,
      # are unaffected.) The checkout itself is still never modified.
      - name: Negative test — a reordered unit call site must fail V1
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/neg-reorder"
          rm -rf "$work"; mkdir -p "$work"
          cp -a "$GITHUB_WORKSPACE/." "$work/"
          test -x "$work/scripts/verify/test-deploy-vps.sh" \
            || { echo "::error::harness is not executable in the copy"; exit 1; }
          src="$work/scripts/vps/deploy-vps.sh"
          cp "$src" "$src.orig"
          awk '
            /^unit_google_workspace$/       { pending = 1; next }
            pending && /^completed google-workspace$/ { pending = 0; moved = 1; next }
            { print }
            moved && !placed && /^completed code-agents$/ {
              print "unit_google_workspace"; print "completed google-workspace"
              placed = 1
            }
            END { if (!moved || !placed) exit 3 }
          ' "$src.orig" > "$src" \
            || { echo "::error::the reorder did not apply — this control is inert"; exit 1; }
          chmod 755 "$src"
          # Same multiset, different order. Asserted against the pre-mutation
          # COPY rather than against HEAD: if the two ever disagreed, this step
          # would be testing "the working tree differs from HEAD", which is a
          # different (and always-true-in-a-dirty-tree) proposition.
          [ "$(sort "$src" | sha256sum)" = "$(sort "$src.orig" | sha256sum)" ] \
            || { echo "::error::the mutation changed the script's lines, not just their order — this control tests the wrong thing"; exit 1; }
          rm -f "$src.orig"
          if "$work/scripts/verify/test-deploy-vps.sh" --only differential; then
            echo "::error::a whole unit call site moved across the systemd block and V1 did not notice"
            exit 1
          fi
          echo "V1 correctly caught a pure reordering of the deploy."
