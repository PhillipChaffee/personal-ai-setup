# The workflows lint themselves. Two tools, two different jobs:
#
#   actionlint  type-checks ${{ }} expressions, validates runner labels, and --
#               the reason it matters most here -- runs ShellCheck over the
#               shell embedded in every `run:` block. shell-lint.yml globs
#               '*.sh' and can never see those lines; this is the only thing
#               in the repo that can.
#   zizmor      supply chain: unpinned actions, credential persistence,
#               over-broad token permissions.
name: actions-lint

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12

jobs:
  actions:
    name: actionlint + zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # The SAME shellcheck pin shell-lint.yml uses. ubuntu-latest ships an
      # unpinned shellcheck whose version moves when GitHub reimages the
      # runner, which would put a moving part inside a pinned gate.
      - name: Install ShellCheck and zizmor (pinned)
        run: pip install --quiet shellcheck-py==0.11.0.1 zizmor==1.30.0

      - name: Install actionlint (checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL -O "${base}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -O "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz\$" \
            "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          ./actionlint --version

      - name: actionlint
        run: ./actionlint -oneline -shellcheck "$(command -v shellcheck)"

      # --no-online-audits keeps the gate independent of the GitHub API.
      # stale-action-refs and known-vulnerable-actions are deliberately left on
      # the table: they are the audits most relevant to a repo that hash-pins,
      # but they would make a green build depend on an external service.
      - name: zizmor
        run: zizmor --no-online-audits --persona regular .

      - name: Negative test — an unpinned action must fail
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/probe/.github/workflows"
          cat > "$RUNNER_TEMP/probe/.github/workflows/p.yml" <<'PROBE'
          name: p
          on: [push]
          jobs:
            j:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
          PROBE
          if zizmor --no-online-audits --persona regular "$RUNNER_TEMP/probe"; then
            echo "::error::zizmor accepted an unpinned action — the gate is inert"
            exit 1
          fi
          echo "zizmor correctly rejected an unpinned action reference."
