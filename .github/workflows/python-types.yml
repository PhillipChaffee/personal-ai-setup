# Enforce the repo's Python conventions: full type annotations + dataclasses,
# mypy --strict clean (config: mypy.ini at the repo root). Any new Python file
# must be added to mypy.ini's `files` list — the glob check below fails the
# build if one is committed without being covered.
name: python-types

on:
  push:
  pull_request:

# Least privilege by default; zizmor flags a workflow with no permissions block
# because it inherits the token's full write scope.
permissions:
  contents: read

# One run per ref per workflow: this repo went from 4 checks to more, and a
# quick follow-up push should cancel the previous run rather than queue behind
# it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  mypy-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        # PINNED, like ruff and coverage. This was bare `mypy` and the repo
        # absorbed a MAJOR version silently: mypy 2.0 (2026-05) flipped
        # local_partial_types on, flipped strict_bytes on, and renamed
        # allow-redefinition. It has been green by luck, not by policy -- a
        # type checker that can change its mind overnight is not a gate.
        run: pip install --quiet mypy==2.3.1
      - name: Every .py file is covered by mypy.ini
        run: |
          missing=0
          while IFS= read -r f; do
            grep -qF "$(echo "$f" | sed 's|^\./||')" mypy.ini || {
              echo "::error file=$f::not listed in mypy.ini [mypy] files"; missing=1;
            }
          done < <(find . -name '*.py' -not -path './.git/*')
          exit $missing
      - name: mypy --strict
        run: mypy
