# Strict lint gate for every .py file in the repo. Config: ruff.toml at the
# repo root (`select = ["ALL"]` — every rule on, exceptions justified there or
# in a `# noqa: RULE` next to the line that needs it).
#
# Companion gate: python-types.yml (mypy --strict). Both must be green.
#
# The ruff version is PINNED: with the whole rule set enabled, an unpinned
# ruff would add rules on its own release schedule and turn CI red on a
# commit that changed nothing. Bump it here and in .pre-commit-config.yaml
# together, as a deliberate change.
name: python-lint

on:
  push:
  pull_request:

# Least privilege by default; zizmor flags a workflow with no permissions block
# because it inherits the token's full write scope.
permissions:
  contents: read

# One run per ref per workflow: this repo went from 4 checks to more, and a
# quick follow-up push should cancel the previous run rather than queue behind
# it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Nothing in this repo pushes from CI, so the token has no
          # business surviving in .git/config where an artifact upload
          # or a later step could pick it up (zizmor: artipacked).
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install --quiet ruff==0.15.8
      - name: ruff check (strict, whole repo)
        run: ruff check --output-format=github .
