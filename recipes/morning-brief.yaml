# Morning brief — daily digest of calendar + important unread email.
# NOT tasks: the gathering steps below read Calendar and Gmail only, so the
# extension asks for no tasks permission and the description says neither.
# If you add a tasks step, add `tasks:readonly` to --permissions and put the
# claim back in the description — all three move together or none do.
# Scheduled on the brain: goose schedule add --schedule-id morning-brief \
#   --cron "0 0 7 * * *" --recipe-source recipes/morning-brief.yaml
# The recipe delivers its own result: its explicit final step emails the
# digest to the account owner via the Gmail send tool (self-addressed only),
# then prints the digest as the final message for the session record.
#
# Multi-account: the google_accounts parameter carries the USER_GOOGLE_EMAILS
# roster (first entry = primary). register-schedules.sh stores it on the
# schedule (`goose schedule add --params`), run-recipe.sh passes it per run;
# with no roster the empty default applies and the run is single-account
# (docs/setup/30-google-oauth.md §8).
version: 1.0.0
title: Morning Brief
description: Daily digest of today's calendar and unread important email.

parameters:
  - key: google_accounts
    input_type: string
    requirement: optional
    default: ""
    description: >-
      Comma-separated Google account emails to sweep, first entry = the
      primary (delivery) account. Empty means the single default account
      workspace-mcp is configured with.

instructions: |
  You are running unattended as a scheduled job. Nobody can answer questions,
  so never ask any. If a tool call fails, retry it once; if it still fails,
  continue with what you have and note the gap in the digest.

  Accounts:
  - Google accounts roster (comma-separated, may be empty): "{{ google_accounts }}"
  - If the roster is empty, work with the single default account the
    workspace-mcp tools use when no account is specified.
  - If the roster lists accounts, repeat the gathering steps below for EACH
    listed account by passing that account's address as the
    user_google_email argument on every workspace-mcp tool call. The FIRST
    address in the roster is the PRIMARY account.
  - With more than one account, prefix digest lines with a short account tag
    (the part before the @, e.g. "[side-project]" for
    side-project@example.com) so items are labeled by account.

  Gather, in this order (per account):
  1. Today's calendar events (Google Calendar via workspace-mcp): start time,
     title, and location or video link if present.
  2. Unread email in the inbox that looks important (Gmail via workspace-mcp):
     sender and subject only. Skip newsletters, promotions, and automated
     notifications.

  Then compose ONE compact plain-text digest (no markdown tables) covering
  all accounts:
  - one headline line: today's date and how busy the day looks
  - "Calendar:" — one line per event, chronological across accounts
  - "Email:" — one line per message, at most 5 per account
  - omit any section that is empty

  Delivery (explicit final step — this run emails its own result):
  - Send the finished digest as ONE email using the Gmail send tool,
    addressed to your own PRIMARY account (the first roster entry, or the
    authenticated user's address when the roster is empty — sender and
    recipient are the same, and the send is made from the primary account),
    subject: "Morning brief — <today's date>", body: the digest as plain
    text.
  - Then END by printing the same digest as your final message (it becomes
    the run's session record), with no commentary before or after it.

  Hard rules:
  - Gmail and Calendar are otherwise read-only in this run — in EVERY
    account: the single self-addressed delivery email from the primary
    account above is the ONLY send, and you never modify, archive, or label
    anything. Never email any other recipient, and never send anything from
    a non-primary account.
  - No shell commands in this run.

prompt: |
  Prepare my morning brief for today. Email it to me as your final
  step, then end by printing the digest itself as your final message.

extensions:
  # Gathers today's events and unread mail, then sends one self-addressed
  # digest. calendar:readonly matches "Calendar is read-only in this run" — it
  # drops the calendar write scopes and removes manage_event from the tool list,
  # so the rule can't be broken by a confused model. VERIFIED 2026-08-23 by
  # running the server over stdio: `calendar:readonly` is a valid level (the
  # server enumerates gmail: readonly|organize|drafts|send|full, calendar:
  # readonly|full, tasks: readonly|manage|full when handed a bogus one), and
  # `--permissions gmail:send calendar:readonly --tool-tier core` registers 6
  # tools — get_events and list_calendars present, manage_event gone. This
  # recipe passes no --tool-tier, so it gets the wider Gmail read set too.
  # gmail:send is the lowest level that can send at all (levels are cumulative).
  # Tasks is not requested: the gathering steps never touch it.
  # Version pinned so the tool surface and consent scopes stay reproducible.
  - type: stdio
    name: workspace-mcp
    description: Google Workspace MCP (Gmail + read-only Calendar; one self-addressed delivery email)
    cmd: uvx
    args:
      - workspace-mcp@1.25.0
      - --permissions
      - gmail:send
      - calendar:readonly
    timeout: 300
    env_keys:
      - GOOGLE_OAUTH_CLIENT_ID
      - GOOGLE_OAUTH_CLIENT_SECRET
      - USER_GOOGLE_EMAIL
settings:
  goose_provider: zen-openai
  # model id verified as of 2026-08-20
  goose_model: minimax-m2.7
  temperature: 0.1
