# Morning brief — daily digest of calendar + important unread email + due tasks.
# Scheduled on the brain: goose schedule add --schedule-id morning-brief \
#   --cron "0 0 7 * * *" --recipe-source recipes/morning-brief.yaml
# The recipe delivers its own result: its explicit final step emails the
# digest to the account owner via the Gmail send tool (self-addressed only),
# then prints the digest as the final message for the session record.
version: 1.0.0
title: Morning Brief
description: Daily digest of today's calendar, unread important email, and due tasks.

instructions: |
  You are running unattended as a scheduled job. Nobody can answer questions,
  so never ask any. If a tool call fails, retry it once; if it still fails,
  continue with what you have and note the gap in the digest.

  Gather, in this order:
  1. Today's calendar events (Google Calendar via workspace-mcp): start time,
     title, and location or video link if present.
  2. Unread email in the inbox that looks important (Gmail via workspace-mcp):
     sender and subject only. Skip newsletters, promotions, and automated
     notifications.

  Then compose ONE compact plain-text digest (no markdown tables):
  - one headline line: today's date and how busy the day looks
  - "Calendar:" — one line per event, chronological
  - "Email:" — one line per message, at most 5
  - omit any section that is empty

  Delivery (explicit final step — this run emails its own result):
  - Send the finished digest as ONE email using the Gmail send tool,
    addressed to your own account (the authenticated user's address —
    sender and recipient are the same), subject:
    "Morning brief — <today's date>", body: the digest as plain text.
  - Then END by printing the same digest as your final message (it becomes
    the run's session record), with no commentary before or after it.

  Hard rules:
  - Gmail and Calendar are otherwise read-only in this run: the single
    self-addressed delivery email above is the ONLY send, and you never
    modify, archive, or label anything. Never email any other recipient.
  - No shell commands in this run.

prompt: |
  Prepare my morning brief for today. Email it to me as your final
  step, then end by printing the digest itself as your final message.

extensions:
  - type: stdio
    name: workspace-mcp
    description: Google Workspace MCP (Gmail + Calendar; one self-addressed delivery email)
    cmd: uvx
    args:
      - workspace-mcp
      - --tools
      - gmail
      - calendar
    timeout: 300
    env_keys:
      - GOOGLE_OAUTH_CLIENT_ID
      - GOOGLE_OAUTH_CLIENT_SECRET
settings:
  goose_provider: zen-openai
  # model id verified as of 2026-08-20
  goose_model: minimax-m2.7
  temperature: 0.1
