# Inbox triage — labels unread mail and drafts replies; NEVER sends anything.
# Scheduled on the brain: goose schedule add --schedule-id inbox-triage \
#   --cron "0 0 9,13,17 * * MON-FRI" --recipe-source recipes/inbox-triage.yaml
# The recipe emails a summary ONLY when action-needed items exist (one
# self-addressed email via the Gmail send tool — the single exception to
# drafts-only). Otherwise its final message is exactly NO_ACTION_NEEDED.
#
# Multi-account: the google_accounts parameter carries the USER_GOOGLE_EMAILS
# roster (first entry = primary). run-recipe.sh passes it from the
# environment; the native scheduler can't pass parameters, so
# register-schedules.sh registers a rendered copy with the roster baked into
# the default when USER_GOOGLE_EMAILS is set (docs/setup/30-google-oauth.md §8).
version: 1.0.0
title: Inbox Triage
description: Labels unread inbox mail, drafts (never sends) replies, and reports only what needs your attention.

parameters:
  - key: google_accounts
    input_type: string
    requirement: optional
    default: ""
    description: >-
      Comma-separated Google account emails to sweep, first entry = the
      primary (delivery) account. Empty means the single default account
      workspace-mcp is configured with.

instructions: |
  You are running unattended as a scheduled job. Nobody can answer questions,
  so never ask any.

  Accounts:
  - Google accounts roster (comma-separated, may be empty): "{{ google_accounts }}"
  - If the roster is empty, triage the single default account the
    workspace-mcp tools use when no account is specified.
  - If the roster lists accounts, triage EACH listed account's inbox by
    passing that account's address as the user_google_email argument on
    every workspace-mcp tool call. The FIRST address in the roster is the
    PRIMARY account. All writes for a message (labels, drafts) must be made
    in the SAME account that holds the message.

  Triage every UNREAD message currently in each Gmail inbox (via
  workspace-mcp):

  1. Classify each message as one of:
     - action-needed: a human reply, decision, payment, or deadline is required
     - fyi: worth knowing, no action required
     - newsletter/promo/automated: bulk or machine-generated mail
  2. Apply Gmail labels accordingly: "Triage/Action", "Triage/FYI",
     "Triage/Newsletter". Create a label the first time it is missing in
     that account.
  3. For action-needed messages where a reply is the obvious next step, write
     a short draft reply and save it as a Gmail DRAFT on the thread — in the
     same account that received the message.

  Absolute prohibitions:
  - You must NEVER send, reply-and-send, or forward any email from ANY
    account. Only draft creation is allowed. If the only tool available
    would send a message, do not use it — drafts only. (The single
    self-addressed summary email from the primary account described below
    is the sole exception.)
  - Do not archive, delete, mark read/unread, or mark spam. Labels and drafts
    are your only Gmail writes.
  - No shell commands in this run.

  Delivery and final message rules (follow these exactly):
  - If one or more messages are action-needed (across all accounts):
    compose a SHORT plain-text summary listing ONLY the action-needed
    items — one line each: sender — subject — what is needed (and whether a
    draft was left). When more than one account was triaged, prefix each
    line with a short account tag (the part before the @, e.g. "[phil]").
    Do not list fyi or newsletter items. Deliver it as ONE email via the
    Gmail send tool, sent from the PRIMARY account and addressed to that
    same primary address (sender and recipient are the same — this
    self-addressed delivery email is the single exception to the
    drafts-only rule), subject "Inbox triage — action needed". Then end by
    printing the same summary as your final message.
  - If nothing is action-needed: send NO email, and your final message must
    be exactly:
    NO_ACTION_NEEDED
    with no other words, punctuation, or formatting.
  - If you could not read an inbox at all: end with a final message that
    briefly says so, naming the account only by its tag — the scheduler's
    session record captures it.

prompt: |
  Triage my unread inbox now. Follow the delivery and final-message rules
  exactly.

extensions:
  - type: stdio
    name: workspace-mcp
    description: Google Workspace MCP (Gmail — labels, drafts, one self-addressed summary email)
    cmd: uvx
    args:
      - workspace-mcp
      - --tools
      - gmail
    timeout: 300
    env_keys:
      - GOOGLE_OAUTH_CLIENT_ID
      - GOOGLE_OAUTH_CLIENT_SECRET
      - USER_GOOGLE_EMAIL

settings:
  goose_provider: zen-openai
  # model id verified as of 2026-08-20
  goose_model: minimax-m2.7
  temperature: 0.1
