# Budget check-in — monthly category-vs-target summary from the vault ledger.
# Registered PAUSED/disabled by default; enable it once ledger.csv is real:
#   goose schedule add --schedule-id budget-checkin \
#     --cron "0 0 9 1 * *" --recipe-source recipes/budget-checkin.yaml
# Runs on Together AI (ZDR). The recipe emails its own summary as an explicit
# final step via one self-addressed Gmail send; the emailed summary must never
# contain account numbers or transaction identifiers. Data stays offline:
# no git, and no network beyond that one self-addressed delivery email.
version: 1.0.0
title: Budget Check-in
description: Compares last month's spending per category against budget targets and reports a compact summary.

instructions: |
  You are running unattended as a scheduled job. Nobody can answer questions,
  so never ask any.

  Inputs (local files, developer extension only):
  - /data/life-vault/finance/ledger.csv — transaction ledger; read its header
    row to learn the columns (expect at least a date, a category, and an
    amount).
  - /data/life-vault/finance/budget.md — monthly targets per category.

  Task:
  1. Determine the most recent COMPLETE calendar month (this job runs on the
     1st, so that is last month).
  2. Total that month's spending per category. If the ledger is long, compute
     totals with shell tools (awk over the CSV) instead of loading the whole
     file into context.
  3. Compare each category against its target from budget.md.

  Compose a compact plain-text summary, nothing else:
  - headline: "Budget check-in — <Month YYYY>"
  - one line per category: "<Category>: <spent> / <target> (under|OVER +<diff>)"
    with overspent categories listed first
  - a "Total: <spent> / <target>" line
  - one closing sentence if anything needs attention (e.g. a category >20%
    over target), otherwise none

  Delivery (explicit final step — this run emails its own result):
  - Send the summary as ONE email via the Gmail send tool, addressed to
    your own account (sender and recipient are the same authenticated
    address), subject "Budget check-in", body: the summary. Never email any
    other recipient.
  - Then END by printing the same summary as your final message, with no
    commentary before or after it.

  Hard rules:
  - Read-only: do not modify ledger.csv or budget.md, and never touch git.
  - The summary leaves the machine as an email. It must NEVER contain account
    numbers, card numbers, bank or institution names, or individual
    transaction descriptions — categories and totals only.
  - The files on disk are the only input, and the single delivery email
    above is the only network action allowed in this run.

prompt: |
  Run the monthly budget check-in for the most recent complete month.
  Email me the summary as your final step, then end by
  printing only the summary.

extensions:
  - type: builtin
    name: developer
    timeout: 300
  - type: stdio
    name: workspace-mcp
    description: Google Workspace MCP (Gmail — one self-addressed delivery email only)
    cmd: uvx
    args:
      - workspace-mcp
      - --tools
      - gmail
    timeout: 300
    env_keys:
      - GOOGLE_OAUTH_CLIENT_ID
      - GOOGLE_OAUTH_CLIENT_SECRET
      - USER_GOOGLE_EMAIL

settings:
  goose_provider: together
  # model id verified as of 2026-08-20
  goose_model: openai/gpt-oss-120b
  temperature: 0.1
